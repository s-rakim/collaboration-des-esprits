[project]
name = "collaboration-des-esprits"
version = "0.2.0"
description = "A room where you and several models think together, with shared memory and chat as its interface"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
esprits = "esprits.cli:main"
esprits-stdio = "esprits.mcp_stdio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esprits"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
