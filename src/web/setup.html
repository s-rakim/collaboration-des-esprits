<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup — Collaboration des Esprits</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/theme.css">
<style>
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
  #nav{margin-bottom:10px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-0.01em}
  .sub{color:var(--dim);margin:0 0 26px}
  .sub a{color:var(--accent)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:30px 0 10px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px}
  .field{margin-bottom:15px}
  .field:last-child{margin-bottom:0}
  label{display:block;font-weight:550;margin-bottom:4px}
  .hint{color:var(--dim);font-size:12.5px;margin:0 0 6px}
  input,select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  input[disabled],select[disabled]{opacity:.55;cursor:not-allowed}
  input.secret{font-family:var(--mono)}
  .row{display:flex;gap:9px;align-items:center}
  button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 13px;white-space:nowrap}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin-left:7px;vertical-align:middle}
  .tag.set{color:var(--good);border-color:var(--good)}
  .tag.env{color:var(--warn);border-color:var(--warn)}
  .tag.unset{color:var(--faint)}
  .switch{display:flex;align-items:center;gap:10px;cursor:pointer}
  .switch input{width:auto;margin:0}
  .note{background:var(--panel2);border-left:3px solid var(--accent);padding:10px 13px;border-radius:0 7px 7px 0;font-size:13px;color:var(--dim);margin:12px 0}
  .note.warn{border-left-color:var(--warn)}
  .bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:13px 16px;margin:26px -16px -64px;display:flex;gap:10px;align-items:center}
  .msg{font-size:13px}
  .msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
  code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
  nav a{color:var(--dim);text-decoration:none;font-size:12.5px;border:1px solid transparent;padding:4px 10px;border-radius:7px}
  nav a:hover{border-color:var(--line);color:var(--text)}
  nav a.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
  textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;resize:vertical;min-height:90px;font-family:inherit}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .seat{display:grid;grid-template-columns:.9fr 1fr 1.3fr .9fr .7fr auto auto auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .conn{display:grid;grid-template-columns:1fr .9fr 1.5fr 1.1fr 1fr auto auto auto auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .conn:last-of-type{border-bottom:0}
  .conn input,.conn select{padding:6px 8px;font-size:12.5px}
  .conn .del,.seat .del{color:var(--bad);border-color:transparent;background:none;padding:4px 7px}
  .conn .del:hover,.seat .del:hover{border-color:var(--bad)}
  .conn .test,.seat .test{font-size:11px;padding:4px 8px}
  .connhead{display:grid;grid-template-columns:1fr .9fr 1.5fr 1.1fr 1fr auto auto auto auto;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding-bottom:5px;border-bottom:1px solid var(--line)}
  @media (max-width:1000px){.conn,.seat{grid-template-columns:1fr 1fr}.connhead,.seathead{display:none}}
  .seat:last-of-type{border-bottom:0}
  .seat input,.seat select{padding:6px 8px;font-size:13px}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
  .swatch{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .swatch input[type=color]{width:34px;height:30px;padding:0;border-radius:7px;border:1px solid var(--line);
    background:none;cursor:pointer;flex:none}
  .swatch .meta{flex:1;min-width:0}
  .swatch .meta b{display:block;font-size:12.5px;font-weight:600}
  .swatch .meta span{display:block;font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
  .swatch input[type=text]{width:88px;font-family:var(--mono);font-size:11.5px;padding:5px 7px;flex:none}
  .swatch.changed{border-color:var(--accent)}
  .seat label.on{display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .seat label.on input{width:16px;height:16px;padding:0;accent-color:var(--accent);cursor:pointer}
  .seat .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;justify-self:center}
  .seat .dot.on{background:var(--good)}
  .seat .del{color:var(--bad);border-color:transparent;background:none;padding:4px 7px}
  .seat .del:hover{border-color:var(--bad)}
  .seathead{display:grid;grid-template-columns:.9fr 1fr 1.3fr .9fr .7fr auto auto auto;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding-bottom:5px;border-bottom:1px solid var(--line)}

  .modelnote{color:var(--faint);font-size:12px;margin-top:8px}
  .sched{display:grid;grid-template-columns:1fr 2fr .8fr .7fr auto auto auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .sched:last-of-type{border-bottom:0}
  .sched input,.sched select{padding:6px 8px;font-size:12.5px}
  .sched .when{font-size:11px;color:var(--faint);font-family:var(--mono)}
  .sched .del{color:var(--bad);border-color:transparent;background:none;padding:4px 7px}
  .sched .run{font-size:11px;padding:4px 8px}
  @media (max-width:900px){.sched{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <h1>Setup</h1>
  <p class="sub">Every model has its own provider and its own key. Keys are stored in the room's own database on this machine and are never sent back to this page — you'll only ever see the last four characters.</p>

  <div id="body">Loading…</div>

  <div class="bar">
    <button class="primary" id="save">Save changes</button>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
let state = null;
// Only fields the user actually edited are sent, so a blank secret box can
// never wipe a stored key by accident.
const edited = { settings: {}, secrets: {} };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

async function api(path, opts) {
  const res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

function say(text, cls = '') {
  const m = $('#msg');
  m.textContent = text;
  m.className = `msg ${cls}`;
}

function secretField(key, s) {
  return `
    <div class="field">
      <label for="s-${key}">${esc(s.label)}
        <span class="tag ${s.locked ? 'env' : s.set ? 'set' : 'unset'}">${
          s.locked ? `from ${esc(s.env)}` : s.set ? `set · ${esc(s.preview)}` : 'not set'
        }</span>
      </label>
      <p class="hint">${esc(s.hint)}</p>
      <input class="secret" id="s-${key}" data-secret="${key}" type="password" autocomplete="off"
        placeholder="${s.locked ? 'set by the environment — edit that instead' : s.set ? 'leave blank to keep the stored key' : 'paste it here'}"
        ${s.locked ? 'disabled' : ''}>
    </div>`;
}

function settingField(key, s, opts) {
  const control = opts
    ? `<select id="f-${key}" data-setting="${key}" ${s.locked ? 'disabled' : ''}>${
        opts.map((o) => `<option value="${esc(o)}" ${String(s.value) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')
      }</select>`
    : `<input id="f-${key}" data-setting="${key}" value="${esc(s.value)}" ${s.locked ? 'disabled' : ''}>`;
  return `
    <div class="field">
      <label for="f-${key}">${esc(s.label)}${s.locked ? `<span class="tag env">from ${esc(s.env)}</span>` : ''}</label>
      ${control}
    </div>`;
}

function toggleField(key, s) {
  const on = /^(1|true|yes|on)$/i.test(String(s.value));
  return `
    <label class="switch">
      <input type="checkbox" id="f-${key}" data-setting="${key}" data-bool="1" ${on ? 'checked' : ''} ${s.locked ? 'disabled' : ''}>
      <span>${esc(s.label)}${s.locked ? `<span class="tag env">from ${esc(s.env)}</span>` : ''}</span>
    </label>`;
}

function render() {
  const { settings: st, secrets: sec } = state;
  $('#body').innerHTML = `
    <h2>Connections — your API keys</h2>
    <div class="card">
      <p class="hint" style="margin:0 0 12px">
        Every endpoint this app can reach. Add as many as you like, from any provider.
        <strong>Nothing here is a fixed list</strong> — pick a preset to fill the fields in, or type your
        own URL and model for something that isn't listed. Anything speaking the usual
        <code>/chat/completions</code>, <code>/audio/transcriptions</code> or
        <code>/images/generations</code> shape will work.
      </p>
      <div class="connhead">
        <span>Name</span><span>Used for</span><span>Base URL</span><span>Default model</span>
        <span>API key</span><span>Voice</span><span></span><span></span><span></span>
      </div>
      <div id="conns"></div>
      <div class="row" style="margin-top:12px">
        <button id="addConn">+ Add a connection</button>
        <select id="presetPick" style="width:auto">
          <option value="">start from a preset…</option>
        </select>
        <span class="modelnote" id="connNote"></span>
      </div>
    </div>

    <h2>The models in your chat</h2>
    <div class="card">
      <p class="hint" style="margin:0 0 12px">
        Each row is a seat in the group chat. Point it at a connection and type <strong>any model
        that endpoint accepts</strong> — the model box is free text, so a model released tomorrow works
        today. Leave it blank to use the connection's default. Mix providers and roles and you get a
        real disagreement rather than one voice repeated.
      </p>
      <div class="seathead">
        <span>Name</span><span>Connection</span><span>Model</span><span>Role</span><span>Effort</span>
        <span>In chat</span><span></span><span></span>
      </div>
      <div id="seats"></div>
      <div class="row" style="margin-top:12px">
        <button id="addSeat">+ Add a model</button>
        <span class="modelnote" id="seatNote"></span>
      </div>
      <div class="note">
        Effort trades thoroughness against tokens. <code>high</code> is the sweet spot; <code>low</code> is
        plenty for a researcher or a scorer; <code>max</code> when correctness matters more than cost.
        It only reaches endpoints that accept the field.
      </div>
    </div>

    <h2>Your other agents</h2>
    <div class="card">
      <p class="hint" style="margin:0">
        Agents you run yourself (in an editor, a CLI, or your own script) connect over the
        connector and need no key here — they bring their own. Point each one at:
      </p>
      <div class="field" style="margin-top:10px">
        <input readonly value="${location.origin}/mcp" onclick="this.select()">
      </div>
      <p class="hint" style="margin:0">
        Identify each with the headers <code>x-esprits-agent</code> and <code>x-esprits-role</code>, or run a
        local one with <code>--as &lt;name&gt; --role &lt;role&gt;</code>. Give every agent a different name.
        These need no key here — they bring their own.
      </p>
    </div>

    <h2>Scheduled</h2>
    <div class="card">
      <p class="hint" style="margin:0 0 12px">
        Standing work: a message fired into the room on a repeat, addressed to everyone, so the
        agents wake and act on it. Useful for a morning brief, or a nightly "what is still blocked".
      </p>
      <div id="scheds"></div>
      <div class="row" style="margin-top:12px">
        <button id="addSched">+ Add a schedule</button>
        <span class="modelnote" id="schedNote"></span>
      </div>
    </div>

    <h2>Telegram</h2>
    <div class="card">
      ${toggleField('telegram_enabled', st.telegram_enabled)}
      <p class="hint" style="margin:8px 0 14px">
        Reach the room from your phone. Long polling, so nothing needs to be exposed — no port, no
        hostname, no certificate.
      </p>
      ${secretField('telegram_token', sec.telegram_token)}
      ${secretField('pair_code', sec.pair_code)}
      <div class="note">A chat can do nothing until it sends <code>/pair &lt;code&gt;</code>, so finding your bot is not enough to read your projects.</div>
    </div>

    <h2>Customize</h2>
    <div class="card">
      ${settingField('human_handle', st.human_handle)}
      <p class="hint" style="margin:-8px 0 16px">Agents @mention you by this. No spaces.</p>

      <div class="field">
        <label for="f-about_me">About you</label>
        <p class="hint">What every model should assume without being told again — what you build,
          who it is for, what you already know. This is prepended to every agent's instructions.</p>
        <textarea id="f-about_me" data-setting="about_me" ${st.about_me.locked ? 'disabled' : ''}
          placeholder="I build self-hosted apps for myself. Node and React Native. Assume I can read code; skip the basics.">${esc(st.about_me.value)}</textarea>
      </div>

      <div class="field">
        <label for="f-house_style">Standing instructions</label>
        <p class="hint">How you want them to work and write. These outrank a model's own habits —
          but never a decision the room has already recorded.</p>
        <textarea id="f-house_style" data-setting="house_style" ${st.house_style.locked ? 'disabled' : ''}
          placeholder="Be blunt. No preamble. Propose two options before building anything. Never add a dependency without saying why.">${esc(st.house_style.value)}</textarea>
      </div>

      <div class="note">Takes effect on each model's next turn — no restart needed.</div>
    </div>

    <h2 id="colours">Colours</h2>
    <div class="card">
      <p class="hint" style="margin:0 0 12px">
        Every colour in the room, and the fonts. Changes show as you make them and save to the
        room's own database, so the way it looks follows the room rather than the browser you
        happened to set it in.
      </p>
      <div class="row" style="margin-bottom:12px">
        <select id="themePreset" style="width:auto"><option value="">start from…</option></select>
        <select id="themeMode" style="width:auto">
          <option value="dark">editing the dark theme</option>
          <option value="light">editing the light theme</option>
        </select>
        <button id="themeReset" style="margin-left:auto">Back to the default</button>
      </div>
      <div id="themeTokens"></div>
      <div id="themeFonts" class="row" style="margin-top:14px"></div>
      <div class="row" style="margin-top:14px">
        <span class="modelnote" id="themeNote"></span>
        <button class="primary" id="themeSave" style="margin-left:auto">Save the colours</button>
      </div>
    </div>

    <div class="note warn">
      Models start and stop as you edit the roster, no restart needed. Telegram is started once at
      boot — restart the server after switching that on.
    </div>`;

  for (const el of document.querySelectorAll('[data-setting]')) {
    el.addEventListener('change', () => {
      edited.settings[el.dataset.setting] = el.dataset.bool ? (el.checked ? 'true' : 'false') : el.value;
      say('unsaved changes', 'err');
    });
  }
  for (const el of document.querySelectorAll('[data-secret]')) {
    el.addEventListener('input', () => {
      edited.secrets[el.dataset.secret] = el.value;
      say('unsaved changes', 'err');
    });
  }
}

// ------------------------------------------- connections and the model roster

let roster = null;

/**
 * What each endpoint said it offers, by connection name.
 *
 * Kept here rather than in the row, because saving anything redraws every row
 * and a list living in the DOM would be thrown away the moment it became
 * useful — which is exactly what happened the first time.
 */
const offered = new Map();

/** Filled from /api/seats; the fallback only matters if that call ever fails. */
let ROLES = [{ id: 'generalist', summary: '' }];
const EFFORTS = ['low','medium','high','xhigh','max'];
const opts = (list, sel) => list.map((v) => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

// ---------------------------------------------------------------- connections

/**
 * `extra` is where a provider's differences live — which header carries the key,
 * where the voice goes, how a search response is shaped. It is carried on the
 * row and sent back on every save, so editing a URL cannot quietly flatten the
 * description that makes the endpoint work.
 */
function connRow(c, isNew = false) {
  const kinds = Object.entries(roster.kinds)
    .map(([id, k]) => `<option value="${esc(id)}" ${c.kind === id ? 'selected' : ''} title="${esc(k.blurb)}">${esc(k.label)}</option>`)
    .join('');
  const keyPlaceholder = c.keySource === 'env' ? `from ${c.keyEnv}`
    : c.keySet ? 'saved — blank keeps it' : 'paste key';
  const extra = c.extra ?? {};

  // A voice connection gets a voice picker, because the voice is the setting
  // you actually change: it is what the room sounds like when it reads a reply
  // out and what an audio generation is made with.
  const voices = [...new Set([...(extra.voices ?? []), ...(extra.voice ? [extra.voice] : [])])];
  const voicePicker = c.kind === 'speak'
    ? `<select class="cvoice" title="the voice this connection speaks in">
         ${voices.length
           ? voices.map((v) => `<option ${v === extra.voice ? 'selected' : ''}>${esc(v)}</option>`).join('')
           : '<option value="">default voice</option>'}
       </select>`
    : '';

  return `<div class="conn" data-conn="${esc(c.name)}" ${isNew ? 'data-new="1"' : ''}
       data-extra="${esc(JSON.stringify(extra))}">
      <input class="cn" value="${esc(c.name)}" placeholder="a name you choose">
      <select class="ck">${kinds}</select>
      <input class="cu" value="${esc(c.baseURL)}" placeholder="https://api.example.com/v1" spellcheck="false">
      <input class="cm" value="${esc(c.model)}" placeholder="${(offered.get(c.name) ?? []).length ? 'pick or type' : 'model id'}"
        spellcheck="false" list="models-${esc(c.name || 'new')}">
      <datalist id="models-${esc(c.name || 'new')}">${(offered.get(c.name) ?? [])
        .map((m) => `<option value="${esc(m)}"></option>`).join('')}</datalist>
      <input class="cs" type="password" autocomplete="off" placeholder="${esc(keyPlaceholder)}"
        title="${esc(c.keyPreview ?? '')}">
      ${voicePicker}
      <button class="find" title="Ask this endpoint what it wants: the right base URL, and the models it will accept.">find</button>
      <button class="test" title="make one real call">test</button>
      <button class="del" title="remove">&times;</button>
    </div>`;
}

function renderConns() {
  $('#conns').innerHTML = roster.connections.length
    ? roster.connections.map((c) => connRow(c)).join('')
    : '<p class="hint" style="margin:0">No connections yet. Add one, or start from a preset.</p>';

  $('#presetPick').innerHTML = '<option value="">start from a preset…</option>' +
    Object.entries(roster.kinds).map(([id, k]) => {
      const mine = roster.presets.filter((pr) => pr.kind === id);
      return mine.length
        ? `<optgroup label="${esc(k.label)}">` +
          mine.map((pr, i) => `<option value="${esc(id)}:${i}">${esc(pr.preset)}</option>`).join('') +
          '</optgroup>'
        : '';
    }).join('');

  const missing = roster.connections.filter((c) => !c.keySet).map((c) => c.name);
  $('#connNote').textContent = missing.length
    ? `${missing.join(', ')} still ${missing.length === 1 ? 'needs' : 'need'} a key`
    : `${roster.connections.length} configured`;
  wireConns();
}

/** The row's saved shape, with the voice picker's current choice folded in. */
function rowExtra(el) {
  let extra = {};
  try { extra = JSON.parse(el.dataset.extra || '{}'); } catch {}
  const picked = el.querySelector('.cvoice')?.value;
  if (picked) extra.voice = picked;
  return extra;
}

function wireConns() {
  for (const el of document.querySelectorAll('.conn')) {
    const save = async () => {
      const name = el.querySelector('.cn').value.trim();
      if (!name) return say('a connection needs a name', 'err');
      const typedKey = el.querySelector('.cs').value;
      const was = el.dataset.conn;
      try {
        say('saving…');
        await api('/api/connections', { method: 'POST', body: JSON.stringify({
          // Saving under the old name and renaming in one call keeps any seat
          // pointing at it attached.
          name: was && was !== name ? was : name,
          ...(was && was !== name ? { rename: name } : {}),
          kind: el.querySelector('.ck').value,
          baseURL: el.querySelector('.cu').value.trim(),
          model: el.querySelector('.cm').value.trim(),
          extra: rowExtra(el),
          ...(typedKey ? { apiKey: typedKey } : {}),
        }) });
        await loadAll();
        say('saved', 'ok');
      } catch (e) { say(e.message, 'err'); }
    };

    for (const f of el.querySelectorAll('.ck, .cu, .cm, .cs, .cvoice')) f.addEventListener('change', save);
    el.querySelector('.cn').addEventListener('blur', () => {
      const name = el.querySelector('.cn').value.trim();
      if (name && (el.dataset.new || name !== el.dataset.conn)) save();
    });

    /**
     * Ask the endpoint what it wants.
     *
     * This replaces the two guesses that made adding a provider a game of
     * error-message roulette: whether the URL wants /v1 on the end, and what
     * the model is really called. The endpoint knows both.
     */
    el.querySelector('.find').addEventListener('click', async () => {
      const name = el.dataset.conn || el.querySelector('.cn').value.trim();
      if (!name) return say('save the row first — it needs a name', 'err');
      const button = el.querySelector('.find');
      button.disabled = true;
      try {
        say(`asking ${name} what it offers…`);
        const found = await api(`/api/connections/${encodeURIComponent(name)}/probe`, {
          method: 'POST',
          body: JSON.stringify({ baseURL: el.querySelector('.cu').value.trim() }),
        });

        offered.set(name, found.models);

        // If what is in the box is not something this endpoint has, the box is
        // wrong — and now there is a list to pick from instead of a guess.
        const model = el.querySelector('.cm');
        const wanted = model.value.trim();
        const keep = wanted && found.models.includes(wanted);
        if (!keep) model.value = '';

        // A repaired URL is already saved server-side, so the rows are reloaded
        // to show the truth rather than patched in place.
        el.querySelector('.cu').value = found.baseURL;
        if (found.changed || !keep) await loadAll();

        const notes = [];
        if (found.changed) notes.push(`fixed the URL to ${found.baseURL}`);
        if (found.clearedModel) notes.push(`"${found.clearedModel}" is not one it has`);
        notes.push(`${found.models.length} models — click the model box to pick one`);
        say(notes.join(' · '), 'ok');
        document.querySelector(`.conn[data-conn="${CSS.escape(name)}"] .cm`)?.focus();
      } catch (err) {
        say(err.message, 'err');
      } finally {
        button.disabled = false;
      }
    });

    el.querySelector('.test').addEventListener('click', async () => {
      const name = el.dataset.conn || el.querySelector('.cn').value.trim();
      if (!name) return say('save the row first', 'err');
      try {
        say(`calling ${name}…`);
        const r = await api(`/api/connections/${encodeURIComponent(name)}/test`, { method: 'POST', body: '{}' });
        say(`${name}: ${r.said}`, r.untested ? '' : 'ok');
      } catch (e) { say(e.message, 'err'); }
    });

    el.querySelector('.del').addEventListener('click', async () => {
      if (el.dataset.new) { el.remove(); return; }
      const name = el.dataset.conn;
      if (!confirm(`Remove the connection "${name}"?`)) return;
      try {
        await api(`/api/connections/${encodeURIComponent(name)}`, { method: 'DELETE' });
        await loadAll();
        say(`${name} removed`, 'ok');
      } catch (e) { say(e.message, 'err'); }
    });
  }
}

function addConnRow(seed) {
  if (!roster.connections.length) $('#conns').innerHTML = '';
  $('#conns').insertAdjacentHTML('beforeend', connRow({
    name: '', kind: 'chat', baseURL: '', model: '', keySet: false, keySource: 'unset', keyPreview: null,
    extra: {},
    ...seed,
  }, true));
  wireConns();
  const row = $('#conns').lastElementChild;
  row.querySelector(seed?.name ? '.cs' : '.cn').focus();
}

$('#body').addEventListener('click', (e) => {
  if (e.target.closest('#addConn')) addConnRow();
  if (e.target.closest('#addSeat')) addSeatRow();
  if (e.target.closest('#addSched')) {
    if (!scheds.length) $('#scheds').innerHTML = '';
    $('#scheds').insertAdjacentHTML('beforeend', schedRow(
      { name: '', prompt: '', atTime: '', everyMinutes: 1440, enabled: true, nextRunAt: null }, true));
    wireScheds();
    $('#scheds').lastElementChild.querySelector('.zn').focus();
  }
});

$('#body').addEventListener('change', (e) => {
  const pick = e.target.closest('#presetPick');
  if (!pick || !pick.value) return;
  const [kind, i] = pick.value.split(':');
  const pr = roster.presets.filter((x) => x.kind === kind)[Number(i)];
  pick.value = '';
  if (!pr) return;
  // A preset only fills the boxes in; everything stays editable, including the
  // name, so two keys from the same provider can sit side by side.
  const taken = new Set(roster.connections.map((c) => c.name));
  let name = pr.preset;
  for (let n = 2; taken.has(name); n++) name = `${pr.preset} ${n}`;
  // The preset's `extra` is the part that makes the endpoint work at all, so it
  // comes along; `voices` rides with it so the picker has something to offer.
  addConnRow({
    name, kind: pr.kind, baseURL: pr.baseURL, model: pr.model,
    extra: { ...(pr.extra ?? {}), ...(pr.voices ? { voices: pr.voices, voice: pr.extra?.voice ?? pr.voices[0] } : {}) },
  });
  say(`filled in ${pr.preset} — add the key${pr.keyHint ? ` (${pr.keyHint})` : ''}`, '');
});

// ----------------------------------------------------------------- the seats

/**
 * One seat.
 *
 * The empty option at the top of the connection list is load-bearing. Without
 * it a seat that has no connection still *showed* the first one — the browser
 * displays the first option when none is selected — so the row read as
 * configured while the server had `connection: null`. Picking the value already
 * on screen fires no change event, so there was no way to fix what looked like
 * it needed no fixing: you added your key, the page looked right, and nothing
 * ever ran.
 */
function seatRow(s, isNew = false) {
  const conns = roster.connections.filter((c) => c.kind === 'chat');
  const picker = conns.length
    ? `<option value="" ${s.connection ? '' : 'selected'}>— pick a connection —</option>` +
      conns.map((c) => `<option value="${esc(c.name)}" ${s.connection === c.name ? 'selected' : ''}>${esc(c.name)}${c.keySet ? '' : ' (no key)'}</option>`).join('')
    : '<option value="">add a chat connection first</option>';

  const state = s.running ? 'running' : !s.connection ? 'no connection yet'
    : !s.ready ? 'that connection has no key' : s.enabled ? 'starting…' : 'switched off';

  return `<div class="seat" data-seat="${esc(s.name)}" ${isNew ? 'data-new="1"' : ''}>
      <input class="sn" value="${esc(s.name)}" placeholder="name" ${isNew ? '' : 'readonly'}>
      <select class="sc">${picker}</select>
      <input class="sm" value="${esc(s.model)}" placeholder="any model id" spellcheck="false"
        title="Free text — whatever this endpoint accepts. Blank uses the connection's default.">
      <select class="sr">${ROLES.map((r) =>
        `<option value="${esc(r.id)}" ${r.id === s.role ? 'selected' : ''} title="${esc(r.summary)}">${esc(r.id)}</option>`,
      ).join('')}</select>
      <select class="se">${opts(EFFORTS, s.effort)}</select>
      <label class="on" title="${s.enabled ? 'in the chat — untick to sit it out' : 'not in the chat'}">
        <input type="checkbox" class="sx" ${s.enabled ? 'checked' : ''}>
      </label>
      <span class="dot ${s.running ? 'on' : ''}" title="${esc(state)}"></span>
      <button class="del" title="remove">&times;</button>
    </div>`;
}

function renderSeats() {
  $('#seats').innerHTML = roster.seats.length
    ? roster.seats.map((s) => seatRow(s)).join('')
    : '<p class="hint" style="margin:0">No models yet. Add one to start the chat.</p>';

  // "0 running" is a fact, not an explanation. Say which seat is stuck on what,
  // because that is the question somebody staring at a silent room is asking.
  const running = roster.seats.filter((s) => s.running).length;
  const unconnected = roster.seats.filter((s) => !s.connection).map((s) => s.name);
  const keyless = roster.seats.filter((s) => s.connection && !s.ready).map((s) => s.name);
  const off = roster.seats.filter((s) => s.connection && s.ready && !s.enabled).map((s) => s.name);
  const notes = [`${running} in the chat`];
  if (unconnected.length) notes.push(`${unconnected.join(', ')} ${unconnected.length === 1 ? 'has' : 'have'} no connection yet — pick one`);
  if (keyless.length) notes.push(`${keyless.join(', ')} ${keyless.length === 1 ? 'is' : 'are'} on a connection with no key`);
  if (off.length) notes.push(`${off.join(', ')} switched off`);
  $('#seatNote').textContent = notes.join(' · ');
  wireSeats();
}

function wireSeats() {
  for (const el of document.querySelectorAll('.seat')) {
    const save = async () => {
      const name = el.querySelector('.sn').value.trim();
      if (!name) return say('a model needs a name', 'err');
      try {
        say('saving…');
        await api('/api/seats', { method: 'POST', body: JSON.stringify({
          name,
          connection: el.querySelector('.sc').value || null,
          model: el.querySelector('.sm').value.trim(),
          role: el.querySelector('.sr').value,
          effort: el.querySelector('.se').value,
          // The switch says whether it is in the chat. Enabling as a side
          // effect of any edit meant the switch might as well not exist.
          enabled: el.querySelector('.sx').checked,
        }) });
        await loadAll();
        say('saved', 'ok');
      } catch (e) { say(e.message, 'err'); }
    };

    for (const f of el.querySelectorAll('.sc, .sr, .se, .sx')) f.addEventListener('change', save);

    // Picking a connection for a seat that had none is the moment it becomes
    // usable, so it joins the chat then rather than needing a second click.
    el.querySelector('.sc').addEventListener('change', (e) => {
      if (e.target.value) el.querySelector('.sx').checked = true;
    }, true);
    el.querySelector('.sm').addEventListener('change', save);
    el.querySelector('.sn').addEventListener('blur', () => { if (el.dataset.new) save(); });

    el.querySelector('.del').addEventListener('click', async () => {
      if (el.dataset.new) { el.remove(); return; }
      const name = el.dataset.seat;
      if (!confirm(`Remove ${name} from the chat? Everything it already said and decided stays.`)) return;
      try {
        await api(`/api/seats/${encodeURIComponent(name)}`, { method: 'DELETE' });
        await loadAll();
        say(`${name} removed`, 'ok');
      } catch (e) { say(e.message, 'err'); }
    });
  }
}

function addSeatRow() {
  if (!roster.seats.length) $('#seats').innerHTML = '';
  const firstChat = roster.connections.find((c) => c.kind === 'chat');
  $('#seats').insertAdjacentHTML('beforeend', seatRow({
    name: '', connection: firstChat?.name ?? '', model: '', role: 'generalist', effort: 'high',
    ready: false, running: false,
  }, true));
  wireSeats();
  $('#seats').lastElementChild.querySelector('.sn').focus();
}

// ------------------------------------------------------------------ schedules

let scheds = [];

function schedRow(s, isNew = false) {
  return `<div class="sched" data-id="${s.id ?? ''}" ${isNew ? 'data-new="1"' : ''}>
      <input class="zn" value="${esc(s.name)}" placeholder="what it is">
      <input class="zp" value="${esc(s.prompt)}" placeholder="what to say to the room">
      <input class="zt" value="${esc(s.atTime)}" placeholder="08:30" title="A daily time. Leave blank to use the interval.">
      <input class="ze" value="${s.everyMinutes}" title="Minutes between runs, when no time is set">
      <label class="switch" title="on"><input type="checkbox" class="zo" ${s.enabled ? 'checked' : ''}></label>
      <button class="run" title="Fire it now to check it does what you meant">run</button>
      <button class="del" title="remove">&times;</button>
      <span class="when" style="grid-column:1/-1">${s.nextRunAt ? `next ${new Date(s.nextRunAt).toLocaleString()}` : 'not scheduled'}${s.lastRunAt ? ` · last ran ${new Date(s.lastRunAt).toLocaleString()}` : ''}</span>
    </div>`;
}

function renderScheds() {
  $('#scheds').innerHTML = scheds.length
    ? scheds.map((s) => schedRow(s)).join('')
    : '<p class="hint" style="margin:0">Nothing scheduled.</p>';
  $('#schedNote').textContent = `${scheds.filter((s) => s.enabled).length} active`;
  wireScheds();
}

function wireScheds() {
  for (const el of document.querySelectorAll('.sched')) {
    const save = async () => {
      const name = el.querySelector('.zn').value.trim();
      const prompt = el.querySelector('.zp').value.trim();
      if (!name || !prompt) return say('a schedule needs a name and something to say', 'err');
      try {
        say('saving…');
        await api('/api/schedules', { method: 'POST', body: JSON.stringify({
          ...(el.dataset.id ? { id: Number(el.dataset.id) } : {}),
          name, prompt,
          atTime: el.querySelector('.zt').value.trim(),
          everyMinutes: Number(el.querySelector('.ze').value) || 1440,
          enabled: el.querySelector('.zo').checked,
          as: state.settings?.human_handle?.value || undefined,
        }) });
        await loadScheds();
        say('saved', 'ok');
      } catch (e) { say(e.message, 'err'); }
    };
    for (const f of el.querySelectorAll('.zt, .ze, .zo')) f.addEventListener('change', save);
    for (const f of el.querySelectorAll('.zn, .zp')) f.addEventListener('blur', () => {
      if (el.dataset.new || f.value.trim()) save();
    });

    el.querySelector('.run').addEventListener('click', async () => {
      if (!el.dataset.id) return say('save it first', 'err');
      try {
        await api(`/api/schedules/${el.dataset.id}/run`, { method: 'POST', body: '{}' });
        await loadScheds();
        say('fired — check the chat', 'ok');
      } catch (e) { say(e.message, 'err'); }
    });

    el.querySelector('.del').addEventListener('click', async () => {
      if (el.dataset.new) { el.remove(); return; }
      if (!confirm('Remove this schedule?')) return;
      try {
        await api(`/api/schedules/${el.dataset.id}`, { method: 'DELETE' });
        await loadScheds();
        say('removed', 'ok');
      } catch (e) { say(e.message, 'err'); }
    });
  }
}

async function loadScheds() {
  scheds = (await api('/api/schedules')).schedules;
  renderScheds();
}

// ------------------------------------------------------------------ colours

/**
 * The colour editor.
 *
 * Changes show on the page as you make them, because choosing a colour from a
 * list of hex codes is guesswork — you pick it by looking at it. The preview is
 * the real page, not a swatch board, so what you are judging is the thing you
 * will be using.
 *
 * Saved values live in the room's database rather than this browser: a room you
 * open from a laptop and a phone should not be two different-looking rooms.
 */
const theme = { meta: null, draft: { dark: {}, light: {}, fonts: {} }, mode: 'dark', dirty: false };

/** What a token is set to right now: the override if there is one, else the default. */
const tokenValue = (mode, key) => theme.draft[mode][key] ?? theme.meta.defaults[mode][key];

/** Push the draft onto this page, so you are looking at what you are choosing. */
function previewTheme() {
  let style = document.getElementById('theme-preview');
  if (!style) {
    style = document.createElement('style');
    style.id = 'theme-preview';
    document.head.append(style);
  }
  // The editor previews the theme you are editing regardless of what the system
  // is set to — otherwise picking dark colours in daylight shows you nothing.
  const vars = Object.entries(theme.draft[theme.mode]).map(([k, v]) => `  --${k}:${v};`);
  for (const [role, choice] of Object.entries(theme.draft.fonts)) {
    const stack = theme.meta.fonts[role]?.choices?.[choice]?.stack;
    if (stack) vars.push(`  --${role}:${stack};`);
  }
  style.textContent = vars.length ? `:root{\n${vars.join('\n')}\n}` : '';
}

function renderTheme() {
  if (!theme.meta) return;
  const mode = theme.mode;

  $('#themeTokens').innerHTML = `<div class="swatches">${theme.meta.tokens.map((t) => {
    const value = tokenValue(mode, t.key);
    const changed = theme.draft[mode][t.key] !== undefined;
    return `<label class="swatch ${changed ? 'changed' : ''}" data-token="${esc(t.key)}" title="${esc(t.hint)}">
        <input type="color" value="${esc(/^#[0-9a-f]{6}$/i.test(value) ? value : '#000000')}">
        <span class="meta"><b>${esc(t.label)}</b><span>${esc(t.hint)}</span></span>
        <input type="text" value="${esc(value)}" spellcheck="false">
      </label>`;
  }).join('')}</div>`;

  $('#themeFonts').innerHTML = Object.entries(theme.meta.fonts).map(([role, def]) => `
    <label style="font-size:12.5px;color:var(--dim);display:flex;gap:7px;align-items:center;margin:0">
      ${esc(def.label)}
      <select data-font="${esc(role)}" style="width:auto">
        ${Object.entries(def.choices).map(([id, c]) =>
          `<option value="${esc(id)}" ${((theme.draft.fonts[role] ?? 'system') === id) ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
      </select>
    </label>`).join('');

  $('#themePreset').innerHTML = '<option value="">start from…</option>' +
    Object.entries(theme.meta.presets).map(([id, p]) => `<option value="${esc(id)}">${esc(p.label)}</option>`).join('');

  // "24 changes, not saved yet" after you have just saved them is a lie that
  // makes somebody press save again to be sure. The two facts are separate.
  const changed = Object.keys(theme.draft.dark).length + Object.keys(theme.draft.light).length
    + Object.keys(theme.draft.fonts).length;
  const from = changed ? `${changed} change${changed === 1 ? '' : 's'} from the default` : 'the default';
  $('#themeNote').textContent = theme.dirty ? `${from} — not saved yet` : from;
  previewTheme();
}

async function loadTheme() {
  theme.meta = await api('/api/theme');
  theme.draft = {
    dark: { ...(theme.meta.saved.dark ?? {}) },
    light: { ...(theme.meta.saved.light ?? {}) },
    fonts: { ...(theme.meta.saved.fonts ?? {}) },
  };
  theme.dirty = false;
  renderTheme();
}

// Everything in the section is wired by delegation, because the rows are redrawn
// whenever the mode changes and listeners bound to the old ones would be gone.
$('#body').addEventListener('input', (e) => {
  const swatch = e.target.closest('.swatch');
  if (!swatch || !theme.meta) return;
  const key = swatch.dataset.token;
  const value = e.target.value.trim();

  // A colour picker and a text box editing the same value: whichever you touch,
  // the other follows, so typing a name and picking a shade both work.
  if (e.target.type === 'color') swatch.querySelector('input[type=text]').value = value;
  else if (/^#[0-9a-f]{6}$/i.test(value)) swatch.querySelector('input[type=color]').value = value;

  if (value.toLowerCase() === theme.meta.defaults[theme.mode][key]) delete theme.draft[theme.mode][key];
  else theme.draft[theme.mode][key] = value;

  swatch.classList.toggle('changed', theme.draft[theme.mode][key] !== undefined);
  theme.dirty = true;
  previewTheme();
  // The rows are not redrawn on every keystroke — that would take the focus out
  // of the box you are typing in — so only the line that reports state is.
  const changed = Object.keys(theme.draft.dark).length + Object.keys(theme.draft.light).length
    + Object.keys(theme.draft.fonts).length;
  $('#themeNote').textContent = `${changed} change${changed === 1 ? '' : 's'} from the default — not saved yet`;
});

$('#body').addEventListener('change', (e) => {
  if (!theme.meta) return;

  const font = e.target.closest('[data-font]');
  if (font) {
    if (font.value === 'system') delete theme.draft.fonts[font.dataset.font];
    else theme.draft.fonts[font.dataset.font] = font.value;
    theme.dirty = true;
    previewTheme();
    renderTheme();
    return;
  }

  if (e.target.id === 'themeMode') { theme.mode = e.target.value; renderTheme(); return; }

  if (e.target.id === 'themePreset' && e.target.value) {
    const preset = theme.meta.presets[e.target.value];
    e.target.value = '';
    if (!preset) return;
    // A preset fills the draft rather than saving: you can still change any of
    // it, and nothing is written until you say so.
    for (const mode of ['dark', 'light']) {
      theme.draft[mode] = {};
      for (const [key, value] of Object.entries(preset[mode])) {
        if (value.toLowerCase() !== theme.meta.defaults[mode][key]) theme.draft[mode][key] = value;
      }
    }
    theme.dirty = true;
    renderTheme();
    say(`${preset.label} — press save to keep it`, '');
  }
});

$('#body').addEventListener('click', async (e) => {
  if (e.target.id === 'themeReset') {
    theme.draft = { dark: {}, light: {}, fonts: {} };
    theme.dirty = true;
    renderTheme();
    say('back to the default — press save to keep it', '');
    return;
  }
  if (e.target.id !== 'themeSave') return;
  try {
    say('saving…');
    const out = await api('/api/theme', { method: 'POST', body: JSON.stringify(theme.draft) });
    // The stylesheet is served with the colours in it, so a fresh copy is what
    // makes the change real for every other page and every other browser.
    document.getElementById('theme-preview')?.remove();
    for (const link of document.querySelectorAll('link[href^="/theme.css"]')) {
      link.href = `/theme.css?v=${Date.now()}`;
    }
    await loadTheme();
    say(out.rejected?.length ? `saved, but ignored: ${out.rejected.join('; ')}` : 'saved — every page uses it now', 'ok');
  } catch (err) { say(err.message, 'err'); }
});

async function loadAll() {
  roster = await api('/api/seats');
  if (roster.roles?.length) ROLES = roster.roles;
  renderConns();
  renderSeats();
  await loadScheds();
}

async function load() {
  state = await api('/api/settings');
  // Kept where the schedule rows can reach it: a schedule speaks as the human.
  state.settings = state.settings ?? {};
  render();
  await loadAll();
  await loadTheme();
}

$('#save').addEventListener('click', async () => {
  $('#save').disabled = true;
  try {
    say('saving…');
    state = await api('/api/settings', { method: 'POST', body: JSON.stringify(edited) });
    edited.settings = {}; edited.secrets = {};
    render();
    // render() rebuilds the whole panel, including both roster containers and
    // the colour rows.
    await loadAll();
    renderTheme();
    say('saved', 'ok');
  } catch (e) {
    say(e.message, 'err');
  } finally {
    $('#save').disabled = false;
  }
});

await load();
</script>
<script type="module" src="/nav.js"></script>
