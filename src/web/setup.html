<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup — Collaboration des Esprits</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e8ee; --dim:#98a0b3; --faint:#6b7488;
    --accent:#7aa2f7; --good:#9ece6a; --warn:#e0af68; --bad:#f7768e;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f6; --line:#dde1e8;
      --text:#12151b; --dim:#5b6373; --faint:#8b93a5;
      --accent:#2d5bd7; --good:#3f8f3f; --warn:#96660d; --bad:#c3364f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-0.01em}
  .sub{color:var(--dim);margin:0 0 26px}
  .sub a{color:var(--accent)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:30px 0 10px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px}
  .field{margin-bottom:15px}
  .field:last-child{margin-bottom:0}
  label{display:block;font-weight:550;margin-bottom:4px}
  .hint{color:var(--dim);font-size:12.5px;margin:0 0 6px}
  input,select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  input[disabled],select[disabled]{opacity:.55;cursor:not-allowed}
  input.secret{font-family:var(--mono)}
  .row{display:flex;gap:9px;align-items:center}
  button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 13px;white-space:nowrap}
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin-left:7px;vertical-align:middle}
  .tag.set{color:var(--good);border-color:var(--good)}
  .tag.env{color:var(--warn);border-color:var(--warn)}
  .tag.unset{color:var(--faint)}
  .switch{display:flex;align-items:center;gap:10px;cursor:pointer}
  .switch input{width:auto;margin:0}
  .note{background:var(--panel2);border-left:3px solid var(--accent);padding:10px 13px;border-radius:0 7px 7px 0;font-size:13px;color:var(--dim);margin:12px 0}
  .note.warn{border-left-color:var(--warn)}
  .bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:13px 16px;margin:26px -16px -64px;display:flex;gap:10px;align-items:center}
  .msg{font-size:13px}
  .msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
  code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
  .back{color:var(--accent);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← back to the room</a>
  <h1>Setup</h1>
  <p class="sub">Keys are stored in the room's own database on this machine and are never sent back to this page — you'll only ever see the last four characters.</p>

  <div id="body">Loading…</div>

  <div class="bar">
    <button class="primary" id="save">Save changes</button>
    <button id="test">Test the Anthropic key</button>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
let state = null;
// Only fields the user actually edited are sent, so a blank secret box can
// never wipe a stored key by accident.
const edited = { settings: {}, secrets: {} };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

async function api(path, opts) {
  const res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

function say(text, cls = '') {
  const m = $('#msg');
  m.textContent = text;
  m.className = `msg ${cls}`;
}

function secretField(key, s) {
  return `
    <div class="field">
      <label for="s-${key}">${esc(s.label)}
        <span class="tag ${s.locked ? 'env' : s.set ? 'set' : 'unset'}">${
          s.locked ? `from ${esc(s.env)}` : s.set ? `set · ${esc(s.preview)}` : 'not set'
        }</span>
      </label>
      <p class="hint">${esc(s.hint)}</p>
      <input class="secret" id="s-${key}" data-secret="${key}" type="password" autocomplete="off"
        placeholder="${s.locked ? 'set by the environment — edit that instead' : s.set ? 'leave blank to keep the stored key' : 'paste it here'}"
        ${s.locked ? 'disabled' : ''}>
    </div>`;
}

function settingField(key, s, opts) {
  const control = opts
    ? `<select id="f-${key}" data-setting="${key}" ${s.locked ? 'disabled' : ''}>${
        opts.map((o) => `<option value="${esc(o)}" ${String(s.value) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')
      }</select>`
    : `<input id="f-${key}" data-setting="${key}" value="${esc(s.value)}" ${s.locked ? 'disabled' : ''}>`;
  return `
    <div class="field">
      <label for="f-${key}">${esc(s.label)}${s.locked ? `<span class="tag env">from ${esc(s.env)}</span>` : ''}</label>
      ${control}
    </div>`;
}

function toggleField(key, s) {
  const on = /^(1|true|yes|on)$/i.test(String(s.value));
  return `
    <label class="switch">
      <input type="checkbox" id="f-${key}" data-setting="${key}" data-bool="1" ${on ? 'checked' : ''} ${s.locked ? 'disabled' : ''}>
      <span>${esc(s.label)}${s.locked ? `<span class="tag env">from ${esc(s.env)}</span>` : ''}</span>
    </label>`;
}

function render() {
  const { settings: st, secrets: sec } = state;
  $('#body').innerHTML = `
    <h2>Talk to Claude in the chat</h2>
    <div class="card">
      ${toggleField('claude_enabled', st.claude_enabled)}
      <p class="hint" style="margin:8px 0 14px">
        Claude joins the room as an ordinary participant: it waits its turn like every other agent,
        and acts through the same calls they do. Tag it by name in the chat, or use the
        <strong>Ask Claude</strong> button, to get an answer straight away.
      </p>
      ${secretField('anthropic_api_key', sec.anthropic_api_key)}
      ${settingField('claude_agent_name', st.claude_agent_name)}
      ${settingField('claude_role', st.claude_role, ['architect','critic','researcher','planner','backend','frontend','reviewer','generalist'])}
      ${settingField('claude_model', st.claude_model)}
      ${settingField('claude_effort', st.claude_effort, ['low','medium','high','xhigh','max'])}
      ${settingField('claude_max_tokens', st.claude_max_tokens)}
      <div class="note">Higher effort means more thorough reasoning and more tokens. <code>high</code> is the sweet spot; use <code>max</code> when correctness matters more than cost.</div>
    </div>

    <h2>Your other agents</h2>
    <div class="card">
      <p class="hint" style="margin:0">
        Agents you run yourself (Claude Code, Cursor, and so on) connect to the connector and need no
        key here — they bring their own. Point each one at:
      </p>
      <div class="field" style="margin-top:10px">
        <input readonly value="${location.origin}/mcp" onclick="this.select()">
      </div>
      <p class="hint" style="margin:0">
        Identify each with the headers <code>x-esprits-agent</code> and <code>x-esprits-role</code>, or run a
        local one with <code>--as &lt;name&gt; --role &lt;role&gt;</code>. Give every agent a different name.
      </p>
    </div>

    <h2>Telegram</h2>
    <div class="card">
      ${toggleField('telegram_enabled', st.telegram_enabled)}
      <p class="hint" style="margin:8px 0 14px">
        Reach the room from your phone. Long polling, so nothing needs to be exposed — no port, no
        hostname, no certificate.
      </p>
      ${secretField('telegram_token', sec.telegram_token)}
      ${secretField('pair_code', sec.pair_code)}
      <div class="note">A chat can do nothing until it sends <code>/pair &lt;code&gt;</code>, so finding your bot is not enough to read your projects.</div>
    </div>

    <h2>You</h2>
    <div class="card">
      ${settingField('human_handle', st.human_handle)}
      <p class="hint" style="margin:0">Agents @mention you by this. No spaces.</p>
    </div>

    <div class="note warn">
      Changing any of this takes effect for new work immediately, but the Claude and Telegram
      background loops are started once at boot — restart the server after switching either of them on.
    </div>`;

  for (const el of document.querySelectorAll('[data-setting]')) {
    el.addEventListener('change', () => {
      edited.settings[el.dataset.setting] = el.dataset.bool ? (el.checked ? 'true' : 'false') : el.value;
      say('unsaved changes', 'err');
    });
  }
  for (const el of document.querySelectorAll('[data-secret]')) {
    el.addEventListener('input', () => {
      edited.secrets[el.dataset.secret] = el.value;
      say('unsaved changes', 'err');
    });
  }
}

async function load() {
  state = await api('/api/settings');
  render();
}

$('#save').addEventListener('click', async () => {
  $('#save').disabled = true;
  try {
    say('saving…');
    state = await api('/api/settings', { method: 'POST', body: JSON.stringify(edited) });
    edited.settings = {}; edited.secrets = {};
    render();
    say('saved', 'ok');
  } catch (e) {
    say(e.message, 'err');
  } finally {
    $('#save').disabled = false;
  }
});

$('#test').addEventListener('click', async () => {
  $('#test').disabled = true;
  try {
    say('calling the API…');
    const r = await api('/api/settings/test-anthropic', { method: 'POST', body: '{}' });
    say(`works — ${r.model} replied "${r.said}"`, 'ok');
  } catch (e) {
    say(e.message, 'err');
  } finally {
    $('#test').disabled = false;
  }
});

await load();
</script>
</body>
</html>
