<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup — Collaboration des Esprits</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e8ee; --dim:#98a0b3; --faint:#6b7488;
    --accent:#7aa2f7; --good:#9ece6a; --warn:#e0af68; --bad:#f7768e;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f6; --line:#dde1e8;
      --text:#12151b; --dim:#5b6373; --faint:#8b93a5;
      --accent:#2d5bd7; --good:#3f8f3f; --warn:#96660d; --bad:#c3364f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-0.01em}
  .sub{color:var(--dim);margin:0 0 26px}
  .sub a{color:var(--accent)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:30px 0 10px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px}
  .field{margin-bottom:15px}
  .field:last-child{margin-bottom:0}
  label{display:block;font-weight:550;margin-bottom:4px}
  .hint{color:var(--dim);font-size:12.5px;margin:0 0 6px}
  input,select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  input[disabled],select[disabled]{opacity:.55;cursor:not-allowed}
  input.secret{font-family:var(--mono)}
  .row{display:flex;gap:9px;align-items:center}
  button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 13px;white-space:nowrap}
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin-left:7px;vertical-align:middle}
  .tag.set{color:var(--good);border-color:var(--good)}
  .tag.env{color:var(--warn);border-color:var(--warn)}
  .tag.unset{color:var(--faint)}
  .switch{display:flex;align-items:center;gap:10px;cursor:pointer}
  .switch input{width:auto;margin:0}
  .note{background:var(--panel2);border-left:3px solid var(--accent);padding:10px 13px;border-radius:0 7px 7px 0;font-size:13px;color:var(--dim);margin:12px 0}
  .note.warn{border-left-color:var(--warn)}
  .bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:13px 16px;margin:26px -16px -64px;display:flex;gap:10px;align-items:center}
  .msg{font-size:13px}
  .msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
  code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
  .back{color:var(--accent);text-decoration:none;font-size:13px}
  .seat{display:grid;grid-template-columns:.9fr 1fr 1.2fr .9fr .7fr 1fr auto auto auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .seat:last-of-type{border-bottom:0}
  .seat input,.seat select{padding:6px 8px;font-size:13px}
  .seat .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;justify-self:center}
  .seat .dot.on{background:var(--good)}
  .seat .del{color:var(--bad);border-color:transparent;background:none;padding:4px 7px}
  .seat .del:hover{border-color:var(--bad)}
  .seathead{display:grid;grid-template-columns:.9fr 1fr 1.2fr .9fr .7fr 1fr auto auto auto;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding-bottom:5px;border-bottom:1px solid var(--line)}
  @media (max-width:900px){.seat{grid-template-columns:1fr 1fr}.seathead{display:none}}
  .seat .test{font-size:11px;padding:4px 8px}
  .modelnote{color:var(--faint);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← back to the room</a>
  <h1>Setup</h1>
  <p class="sub">Every model has its own provider and its own key. Keys are stored in the room's own database on this machine and are never sent back to this page — you'll only ever see the last four characters.</p>

  <div id="body">Loading…</div>

  <div class="bar">
    <button class="primary" id="save">Save changes</button>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
let state = null;
// Only fields the user actually edited are sent, so a blank secret box can
// never wipe a stored key by accident.
const edited = { settings: {}, secrets: {} };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

async function api(path, opts) {
  const res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

function say(text, cls = '') {
  const m = $('#msg');
  m.textContent = text;
  m.className = `msg ${cls}`;
}

function secretField(key, s) {
  return `
    <div class="field">
      <label for="s-${key}">${esc(s.label)}
        <span class="tag ${s.locked ? 'env' : s.set ? 'set' : 'unset'}">${
          s.locked ? `from ${esc(s.env)}` : s.set ? `set · ${esc(s.preview)}` : 'not set'
        }</span>
      </label>
      <p class="hint">${esc(s.hint)}</p>
      <input class="secret" id="s-${key}" data-secret="${key}" type="password" autocomplete="off"
        placeholder="${s.locked ? 'set by the environment — edit that instead' : s.set ? 'leave blank to keep the stored key' : 'paste it here'}"
        ${s.locked ? 'disabled' : ''}>
    </div>`;
}

function settingField(key, s, opts) {
  const control = opts
    ? `<select id="f-${key}" data-setting="${key}" ${s.locked ? 'disabled' : ''}>${
        opts.map((o) => `<option value="${esc(o)}" ${String(s.value) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')
      }</select>`
    : `<input id="f-${key}" data-setting="${key}" value="${esc(s.value)}" ${s.locked ? 'disabled' : ''}>`;
  return `
    <div class="field">
      <label for="f-${key}">${esc(s.label)}${s.locked ? `<span class="tag env">from ${esc(s.env)}</span>` : ''}</label>
      ${control}
    </div>`;
}

function toggleField(key, s) {
  const on = /^(1|true|yes|on)$/i.test(String(s.value));
  return `
    <label class="switch">
      <input type="checkbox" id="f-${key}" data-setting="${key}" data-bool="1" ${on ? 'checked' : ''} ${s.locked ? 'disabled' : ''}>
      <span>${esc(s.label)}${s.locked ? `<span class="tag env">from ${esc(s.env)}</span>` : ''}</span>
    </label>`;
}

function render() {
  const { settings: st, secrets: sec } = state;
  $('#body').innerHTML = `
    <h2>The models in your chat</h2>
    <div class="card">
      <p class="hint" style="margin:0 0 12px">
        Each row is a seat in the group chat, with <strong>its own provider and its own key</strong>.
        They see each other's messages, take turns, argue, and score each other's proposals — so mix
        providers and roles and you get a real disagreement rather than one voice repeated.
      </p>
      <div class="seathead">
        <span>Name</span><span>Provider</span><span>Model</span><span>Role</span><span>Effort</span>
        <span>API key</span><span>On</span><span></span><span></span>
      </div>
      <div id="seats"></div>
      <div class="row" style="margin-top:12px">
        <button id="addSeat">+ Add a model</button>
        <span class="modelnote" id="seatNote"></span>
      </div>
      <div class="note">
        Effort trades thoroughness against tokens. <code>high</code> is the sweet spot; <code>low</code> is
        plenty for a researcher or a scorer; <code>max</code> when correctness matters more than cost.
        It only applies to providers that support it.
      </div>
    </div>

    <h2>Your other agents</h2>
    <div class="card">
      <p class="hint" style="margin:0">
        Agents you run yourself (in an editor, a CLI, or your own script) connect over the
        connector and need no key here — they bring their own. Point each one at:
      </p>
      <div class="field" style="margin-top:10px">
        <input readonly value="${location.origin}/mcp" onclick="this.select()">
      </div>
      <p class="hint" style="margin:0">
        Identify each with the headers <code>x-esprits-agent</code> and <code>x-esprits-role</code>, or run a
        local one with <code>--as &lt;name&gt; --role &lt;role&gt;</code>. Give every agent a different name.
      </p>
    </div>

    <h2>Telegram</h2>
    <div class="card">
      ${toggleField('telegram_enabled', st.telegram_enabled)}
      <p class="hint" style="margin:8px 0 14px">
        Reach the room from your phone. Long polling, so nothing needs to be exposed — no port, no
        hostname, no certificate.
      </p>
      ${secretField('telegram_token', sec.telegram_token)}
      ${secretField('pair_code', sec.pair_code)}
      <div class="note">A chat can do nothing until it sends <code>/pair &lt;code&gt;</code>, so finding your bot is not enough to read your projects.</div>
    </div>

    <h2>You</h2>
    <div class="card">
      ${settingField('human_handle', st.human_handle)}
      <p class="hint" style="margin:0">Agents @mention you by this. No spaces.</p>
    </div>

    <div class="note warn">
      Models start and stop as you edit the roster, no restart needed. Telegram is started once at
      boot — restart the server after switching that on.
    </div>`;

  for (const el of document.querySelectorAll('[data-setting]')) {
    el.addEventListener('change', () => {
      edited.settings[el.dataset.setting] = el.dataset.bool ? (el.checked ? 'true' : 'false') : el.value;
      say('unsaved changes', 'err');
    });
  }
  for (const el of document.querySelectorAll('[data-secret]')) {
    el.addEventListener('input', () => {
      edited.secrets[el.dataset.secret] = el.value;
      say('unsaved changes', 'err');
    });
  }
}

// ------------------------------------------------------------- model roster

let roster = null;

const provider = (id) => roster.providers.find((p) => p.id === id) ?? roster.providers[0];

function seatRow(s, isNew = false) {
  const prov = provider(s.provider);
  const provs = roster.providers
    .map((p) => `<option value="${esc(p.id)}" ${s.provider === p.id ? 'selected' : ''}>${esc(p.label)}</option>`).join('');

  // A model typed by hand, or one newer than this list, must still round-trip.
  const known = prov.models.map((m) =>
    `<option value="${esc(m.id)}" ${s.model === m.id ? 'selected' : ''} title="${esc(m.note ?? '')}">${esc(m.label)}</option>`).join('');
  const custom = s.model && !prov.models.some((m) => m.id === s.model)
    ? `<option value="${esc(s.model)}" selected>${esc(s.model)}</option>` : '';

  const roles = ['architect','critic','researcher','planner','backend','frontend','reviewer','generalist']
    .map((r) => `<option ${s.role === r ? 'selected' : ''}>${r}</option>`).join('');
  const efforts = ['low','medium','high','xhigh','max']
    .map((e) => `<option ${s.effort === e ? 'selected' : ''}>${e}</option>`).join('');

  const keyPlaceholder = s.keySource === 'env'
    ? `from ${prov.keyEnv}`
    : s.keySet && s.keySource === 'stored'
      ? 'saved — blank keeps it'
      : prov.keyOptional ? 'not needed' : 'paste key';

  return `<div class="seat" data-seat="${esc(s.name)}" ${isNew ? 'data-new="1"' : ''}>
      <input class="sn" value="${esc(s.name)}" placeholder="name" ${isNew ? '' : 'readonly'}>
      <select class="sp">${provs}</select>
      <select class="sm">${custom}${known}<option value="__other">other…</option></select>
      <select class="sr">${roles}</select>
      <select class="se">${efforts}</select>
      <input class="sk" type="password" autocomplete="off" placeholder="${esc(keyPlaceholder)}"
        title="${esc(s.keyPreview ?? prov.keyHint ?? '')}">
      <span class="dot ${s.running ? 'on' : ''}" title="${s.running ? 'running' : 'not running'}"></span>
      <button class="test" title="make one real call">test</button>
      <button class="del" title="remove">&times;</button>
    </div>`;
}

function renderSeats() {
  $('#seats').innerHTML = roster.seats.length
    ? roster.seats.map((s) => seatRow(s)).join('')
    : '<p class="hint" style="margin:0">No models yet. Add one to start the chat.</p>';
  const running = roster.seats.filter((s) => s.running).length;
  const keyless = roster.seats.filter((s) => s.enabled && !s.keySet).map((s) => s.name);
  $('#seatNote').textContent = keyless.length
    ? `${running} running · ${keyless.join(', ')} still ${keyless.length === 1 ? 'needs' : 'need'} a key`
    : `${running} running`;
  wireSeats();
}

function wireSeats() {
  for (const el of document.querySelectorAll('.seat')) {
    const save = async () => {
      const name = el.querySelector('.sn').value.trim();
      if (!name) return say('a model needs a name', 'err');
      let model = el.querySelector('.sm').value;
      if (model === '__other') {
        model = prompt('Model id, exactly as the provider spells it:') ?? '';
        if (!model.trim()) return loadSeats();
      }
      const typedKey = el.querySelector('.sk').value;
      try {
        say('saving…');
        await api('/api/seats', { method: 'POST', body: JSON.stringify({
          name,
          provider: el.querySelector('.sp').value,
          model,
          role: el.querySelector('.sr').value,
          effort: el.querySelector('.se').value,
          // Sent only when actually typed, so saving a row cannot wipe the key
          // that is already stored for it.
          ...(typedKey ? { apiKey: typedKey } : {}),
          enabled: true,
        }) });
        await loadSeats();
        say('saved', 'ok');
      } catch (e) { say(e.message, 'err'); }
    };

    // Changing provider changes which models are valid, so re-render the row
    // from the provider's own list before saving anything.
    el.querySelector('.sp').addEventListener('change', () => {
      const p = provider(el.querySelector('.sp').value);
      const s = {
        name: el.querySelector('.sn').value.trim(),
        provider: p.id,
        model: p.models[0]?.id ?? '',
        role: el.querySelector('.sr').value,
        effort: el.querySelector('.se').value,
        keySet: false, keySource: 'unset', running: false,
      };
      el.outerHTML = seatRow(s, Boolean(el.dataset.new) || !s.name);
      wireSeats();
      say('pick a model and key, then it saves', 'err');
    });

    for (const sel of el.querySelectorAll('.sm, .sr, .se')) sel.addEventListener('change', save);
    el.querySelector('.sk').addEventListener('change', save);
    el.querySelector('.sn').addEventListener('blur', () => { if (el.dataset.new) save(); });

    el.querySelector('.test').addEventListener('click', async () => {
      const name = el.dataset.seat || el.querySelector('.sn').value.trim();
      if (!name) return say('save the row first', 'err');
      try {
        say(`calling ${name}'s provider…`);
        const r = await api(`/api/seats/${encodeURIComponent(name)}/test`, { method: 'POST', body: '{}' });
        say(`${r.seat} works — ${r.model} replied "${r.said}"`, 'ok');
      } catch (e) { say(e.message, 'err'); }
    });

    el.querySelector('.del').addEventListener('click', async () => {
      if (el.dataset.new) { el.remove(); return; }
      const name = el.dataset.seat;
      if (!confirm(`Remove ${name} from the chat? Everything it already said and decided stays.`)) return;
      try {
        await api(`/api/seats/${encodeURIComponent(name)}`, { method: 'DELETE' });
        await loadSeats();
        say(`${name} removed`, 'ok');
      } catch (e) { say(e.message, 'err'); }
    });
  }
}

/**
 * Delegated from the static container, because #addSeat is created by render()
 * and so does not exist when this module first runs.
 */
$('#body').addEventListener('click', (e) => {
  if (!e.target.closest('#addSeat')) return;
  if (!roster.seats.length) $('#seats').innerHTML = '';
  const p = roster.providers[0];
  $('#seats').insertAdjacentHTML('beforeend', seatRow(
    { name: '', provider: p.id, model: p.models[0]?.id ?? '', role: 'generalist', effort: 'high',
      keySet: false, keySource: 'unset', running: false },
    true,
  ));
  wireSeats();
  $('#seats').lastElementChild.querySelector('.sn').focus();
});

async function loadSeats() {
  roster = await api('/api/seats');
  renderSeats();
}

async function load() {
  state = await api('/api/settings');
  render();
  await loadSeats();
}

$('#save').addEventListener('click', async () => {
  $('#save').disabled = true;
  try {
    say('saving…');
    state = await api('/api/settings', { method: 'POST', body: JSON.stringify(edited) });
    edited.settings = {}; edited.secrets = {};
    render();
    // render() rebuilds the whole panel, including the roster's container.
    await loadSeats();
    say('saved', 'ok');
  } catch (e) {
    say(e.message, 'err');
  } finally {
    $('#save').disabled = false;
  }
});

await load();
</script>
</body>
</html>
