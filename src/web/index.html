<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collaboration des Esprits</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e8ee; --dim:#98a0b3; --faint:#6b7488;
    --accent:#7aa2f7; --good:#9ece6a; --warn:#e0af68; --bad:#f7768e; --human:#bb9af7;
    --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f6; --line:#dde1e8;
      --text:#12151b; --dim:#5b6373; --faint:#8b93a5;
      --accent:#2d5bd7; --good:#3f8f3f; --warn:#96660d; --bad:#c3364f; --human:#6f3fc0;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-0.01em}
  header h1 small{color:var(--faint);font-weight:400;margin-left:8px}
  .stats{display:flex;gap:14px;color:var(--dim);font-size:12px;flex-wrap:wrap}
  .stats b{color:var(--text)}
  .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  main{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:0;height:calc(100vh - 53px)}
  @media (max-width:1340px){main{grid-template-columns:210px minmax(0,1fr) 290px}}
  @media (max-width:1080px){main{grid-template-columns:1fr;height:auto}aside,section{border:0!important}}
  aside,.mid,.ctx{overflow-y:auto;padding:14px}
  aside{border-right:1px solid var(--line)}
  .ctx{border-left:1px solid var(--line)}
  .mid{display:flex;flex-direction:column;padding:0}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:18px 0 8px;font-weight:600}
  h2:first-child{margin-top:0}
  button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,textarea,select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
  textarea{resize:vertical;min-height:62px;font-family:inherit}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .idea{padding:8px 9px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
  .idea:hover{background:var(--panel2)}
  .idea.on{background:var(--panel2);border-color:var(--accent)}
  .idea .t{font-weight:550;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idea .m{color:var(--faint);font-size:11px;margin-top:2px}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}
  .badge.raw{color:var(--faint)} .badge.refining,.badge.proposing{color:var(--warn);border-color:var(--warn)}
  .badge.spec{color:var(--accent);border-color:var(--accent)}
  .badge.building{color:var(--human);border-color:var(--human)}
  .badge.review{color:var(--warn);border-color:var(--warn)}
  .badge.done{color:var(--good);border-color:var(--good)}
  .feed{flex:1;overflow-y:auto;padding:14px 16px;min-height:340px}
  .msg{margin-bottom:14px}
  .msg .h{display:flex;gap:8px;align-items:baseline;font-size:12px;margin-bottom:3px;flex-wrap:wrap}
  .msg .who{font-weight:650}
  .msg.human .who{color:var(--human)}
  .msg .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .msg .when{color:var(--faint);font-size:11px;margin-left:auto}
  .msg .b{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 11px;background:var(--panel);border-radius:var(--radius);border:1px solid var(--line)}
  .msg.k-system .b{background:transparent;border:0;border-left:2px solid var(--line);border-radius:0;color:var(--dim);font-size:13px;padding:2px 0 2px 10px}
  .msg.k-proposal .b{border-left:3px solid var(--accent)}
  .msg.k-critique .b{border-left:3px solid var(--warn)}
  .msg.k-decision .b{border-left:3px solid var(--good)}
  .msg.k-question .b{border-left:3px solid var(--bad)}
  .msg.k-handoff .b{border-left:3px solid var(--human)}
  .msg .b .mention{color:var(--accent);font-weight:600}
  .composer{border-top:1px solid var(--line);padding:11px 16px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;align-items:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px;font-size:13px}
  .card .cardh{font-weight:600;margin-bottom:4px}
  .card .why{color:var(--dim);font-size:12px;white-space:pre-wrap}
  .q .cardh{color:var(--bad)}
  .prop{border-left:3px solid var(--line)}
  .prop.lead{border-left-color:var(--good)}
  .prop.held{border-left-color:var(--bad)}
  .score{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .verdict{font-size:12px;color:var(--warn);margin:0 0 8px;font-style:italic}
  .task{display:flex;gap:7px;align-items:baseline;padding:4px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
  .task:last-child{border:0}
  .task .id{font-family:var(--mono);color:var(--faint);font-size:11px}
  .task .st{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
  .task.done{opacity:.5}.task.done .tt{text-decoration:line-through}
  .task.claimable .st{color:var(--good)}
  .agent{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:3px 0}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.working{background:var(--good)}.dot.blocked{background:var(--bad)}.dot.idle{background:var(--warn)}.dot.away{background:var(--faint)}
  .empty{color:var(--faint);font-size:13px;padding:8px 0}
  .hit{padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;border-left:2px solid var(--accent);margin-bottom:4px;background:var(--panel)}
  .hit:hover{background:var(--panel2)}
  .hit b{color:var(--accent);font-weight:600}
  .hit .w{color:var(--faint);font-size:11px;display:block;margin-top:2px}
  .proj{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:12px 0 4px;padding-left:2px;font-weight:600}
  .attn{border-left:3px solid var(--warn)}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(520px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog h3{margin:0 0 12px;font-size:15px}
  .fields{display:flex;flex-direction:column;gap:9px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
  .toast.on{opacity:1}
  code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 4px;border-radius:4px}
  .mic{position:relative}
  .mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
  .mic.live{background:var(--good);border-color:var(--good);color:#fff}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .mic.rec,.mic.live{animation:pulse 1.4s ease-in-out infinite}
  #hear.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #hear.talking{animation:pulse 1.4s ease-in-out infinite}
  .msg.saying{box-shadow:inset 3px 0 0 var(--accent)}
  .vu{height:3px;border-radius:2px;background:var(--line);overflow:hidden;flex:1;min-width:60px;display:none}
  .vu.on{display:block}
  .vu i{display:block;height:100%;width:0%;background:var(--good);transition:width .08s linear}
  .msg .b img,.msg .b video{max-width:100%;border-radius:8px;margin-top:7px;display:block;border:1px solid var(--line)}
  .msg .b audio{width:100%;margin-top:7px}
  .slashwrap{position:relative}
  .slash{position:absolute;bottom:calc(100% + 6px);left:0;right:0;max-height:266px;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:5px;z-index:20;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .slash .opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
  .slash .opt.on{background:var(--panel2)}
  .slash .opt .ic{font-size:16px;width:20px;text-align:center;flex:none}
  .slash .opt .t{font-size:13px;font-weight:550}
  .slash .opt .d{font-size:11.5px;color:var(--faint);margin-left:auto;text-align:right}
  .slash .head{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:7px 10px 3px}
  .hit{padding:8px 9px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
  .hit:hover{border-color:var(--accent)}
  .hit b{font-size:12.5px;display:block}
  .hit span{font-size:11.5px;color:var(--faint);word-break:break-all}
  .voicetag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .floor{font-size:12.5px}
  .floor .now{display:flex;gap:7px;align-items:center;padding:5px 8px;background:var(--panel2);border-radius:7px;border-left:3px solid var(--good);margin-bottom:6px}
  .floor .wait{display:flex;gap:7px;align-items:baseline;padding:3px 8px;color:var(--dim)}
  .floor .u{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-left:auto;flex:none}
  .floor .u.blocker{color:var(--bad)} .floor .u.answer{color:var(--accent)}
  .floor .u.objection{color:var(--warn)} .floor .u.proposal{color:var(--human)}
  .msg .acts{opacity:0;transition:opacity .12s;display:flex;gap:6px;margin-left:6px}
  .msg:hover .acts{opacity:1}
  .msg .acts button{font-size:11px;padding:1px 7px;border-radius:5px}
  .msg .rl{font-size:11.5px;color:var(--faint);margin-bottom:3px}
  .msg .rl b{color:var(--dim);font-weight:600}
  .chip{display:flex;gap:7px;align-items:center;background:var(--panel2);border:1px solid var(--accent);border-radius:7px;padding:5px 9px;font-size:12.5px}
  .chip b{color:var(--accent)}
  .chip button{border:0;background:none;color:var(--dim);padding:0 3px;font-size:14px;line-height:1}
  .headlink{color:var(--dim);text-decoration:none;font-size:12px;border:1px solid var(--line);padding:4px 9px;border-radius:7px}
  .headlink:hover{border-color:var(--accent);color:var(--text)}
</style>
</head>
<body>
<header>
  <nav id="nav"></nav>
  <h1 id="title">The lobby <small>cross-cutting chat</small></h1>
  <div class="stats" id="stats"></div>
  <div class="me">
    <span id="meLabel">not identified</span>
    <button id="setMe">change</button>
    <button class="primary" id="newIdea">Drop an idea</button>
  </div>
</header>

<main>
  <aside>
    <input id="search" placeholder="Search everything ever said" autocomplete="off"
      style="margin-bottom:10px;font-size:12.5px;padding:6px 9px">
    <div id="results"></div>
    <div id="context"></div>
    <h2>Speaking</h2>
    <div class="floor" id="floor"></div>
    <h2>In the room</h2>
    <div id="roster"></div>
  </aside>

  <div class="mid">
    <div class="feed" id="feed"></div>
    <div class="composer">
      <div class="row" id="targetRow" style="display:none">
        <div class="chip">
          asking <b id="targetName"></b> <span id="targetAbout" style="color:var(--dim)"></span>
          <button id="targetClear" title="cancel">&times;</button>
        </div>
      </div>
      <div class="slashwrap">
        <div class="slash" id="slash" hidden></div>
        <textarea id="body" placeholder="Say something. @mention an agent by name, @all for everyone, / for what else you can do."></textarea>
      </div>
      <div class="row">
        <select id="kind" style="width:auto">
          <option value="message">message</option>
          <option value="question">question</option>
          <option value="status">status</option>
        </select>
        <button id="attach" title="Attach a file. PDF, Word, Excel, PowerPoint and anything textual are read, not just linked.">＋ File</button>
        <input type="file" id="file" style="display:none" multiple>
        <button class="mic" id="mic" title="Hold to talk, or click to record. Needs a speech-to-text connection.">🎙 Talk</button>
        <button id="live" title="Hands-free: keeps listening and posts each time you stop speaking.">Live</button>
        <button id="hear" title="Read replies aloud as they arrive.">🔊 Listen</button>
        <select id="voiceSel" style="width:auto;display:none" title="Which voice the room speaks with"></select>
        <button id="gen" title="Generate an image, a video or a voice line">Create</button>
        <span class="vu" id="vu"><i></i></span>
        <span id="where" style="color:var(--dim);font-size:12px"></span>
        <button class="primary" id="send" style="margin-left:auto">Send</button>
      </div>
    </div>
  </div>

  <div class="ctx" id="ctx"></div>
</main>

<dialog id="dlgMe">
  <h3>Who are you?</h3>
  <div class="fields">
    <input id="meName" placeholder="your handle, no spaces (e.g. rakim)" autocomplete="off">
    <p style="color:var(--dim);font-size:12px;margin:0">
      You join as a human, which means agents cannot answer questions addressed to you,
      and you can overrule the room when it deadlocks.
    </p>
    <div class="row" style="justify-content:flex-end">
      <button id="meCancel">Cancel</button>
      <button class="primary" id="meSave">Join</button>
    </div>
  </div>
</dialog>

<dialog id="dlgIdea">
  <h3>Drop an idea</h3>
  <div class="fields">
    <input id="ideaTitle" placeholder="One line: what is it?" autocomplete="off">
    <textarea id="ideaRaw" rows="7" placeholder="Dump everything. As messy as you like — this text is kept verbatim forever, and your agents work from it."></textarea>
    <div class="row" style="justify-content:flex-end">
      <button id="ideaCancel">Cancel</button>
      <button class="primary" id="ideaSave">Drop it</button>
    </div>
  </div>
</dialog>

<dialog id="dlgSearch">
  <h3>Search the web</h3>
  <div class="fields">
    <input id="searchQ" placeholder="What to look up" autocomplete="off">
    <div id="searchOut" style="max-height:300px;overflow:auto"></div>
    <div class="row" style="justify-content:flex-end">
      <span id="searchMsg" style="color:var(--dim);font-size:12px;flex:1"></span>
      <button id="searchClose">Close</button>
      <button class="primary" id="searchGo">Search</button>
    </div>
  </div>
</dialog>

<dialog id="dlgSwarm">
  <h3>Hand it to the swarm</h3>
  <div class="fields">
    <textarea id="swarmGoal" rows="3" placeholder="The whole job. It gets split into pieces and run in parallel."></textarea>
    <div class="row">
      <label style="color:var(--dim);font-size:12px;display:flex;gap:7px;align-items:center;margin:0">
        pieces <input id="swarmN" type="number" min="2" max="8" value="4" style="width:64px">
      </label>
      <select id="swarmSeat" style="width:auto"></select>
      <span id="swarmMsg" style="color:var(--dim);font-size:12px;flex:1"></span>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button id="swarmCancel">Cancel</button>
      <button class="primary" id="swarmGo">Run it</button>
    </div>
  </div>
</dialog>

<dialog id="dlgGen">
  <h3>Create something</h3>
  <div class="fields">
    <div class="row">
      <select id="genKind" style="width:auto">
        <option value="image">Image</option>
        <option value="video">Video</option>
        <option value="audio">Audio</option>
      </select>
      <span class="hint" id="genNote" style="color:var(--dim);font-size:12px"></span>
    </div>
    <textarea id="genPrompt" rows="4" placeholder="Describe it. The generator sees only this text, not the conversation."></textarea>
    <p class="hint" id="genHint" style="color:var(--dim);font-size:12px;margin:0"></p>
    <div class="row" style="justify-content:flex-end">
      <button id="genCancel">Cancel</button>
      <button class="primary" id="genGo">Create</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script type="module">
import { markIdea, refreshNav, dialogMessage } from '/nav.js';

const $ = (s) => document.querySelector(s);
const state = { me: null, idea: null, head: 0, msgs: [], brief: null, overview: null, floor: null, target: null };

// A thread can be opened by link — from the rail on another page, or a
// bookmark — so the URL is read before anything is drawn.
state.idea = new URLSearchParams(location.search).get('idea') || null;

// localStorage is only ever a convenience here (remembering your handle); the
// room itself lives in SQLite, so a cleared browser loses nothing.
try { state.me = localStorage.getItem('esprits.me'); } catch {}

/**
 * Say something to the person.
 *
 * A modal is painted above the page, so a toast raised while one is open is
 * behind it and might as well not have been raised. When a dialog is open the
 * message goes in the dialog.
 */
function toast(msg, kind = 'err') {
  if (dialogMessage(msg, kind)) return;
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 4000);
}

async function api(path, opts) {
  const res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const linkMentions = (s) => esc(s).replace(/(^|\s)@([a-zA-Z0-9][\w.-]*)/g, '$1<span class="mention">@$2</span>');

/**
 * Turn generated-media markdown into real elements. Only /media/ paths are
 * embedded — this app's own files — so a model cannot make the page load
 * something arbitrary off the internet by writing an img tag into a message.
 */
function renderBody(body) {
  const withoutMedia = String(body).replace(/!\[[^\]]*\]\((\/media\/[\w.-]+)\)/g, '\u0000$1\u0000');
  return linkMentions(withoutMedia).replace(/\u0000(\/media\/[\w.-]+)\u0000/g, (_, url) => {
    if (/\.(png|jpe?g|gif|webp|svg)$/i.test(url)) return `<img src="${url}" alt="generated image" loading="lazy">`;
    if (/\.(mp4|webm|mov)$/i.test(url)) return `<video src="${url}" controls preload="metadata"></video>`;
    if (/\.(mp3|wav|ogg|webm)$/i.test(url)) return `<audio src="${url}" controls></audio>`;
    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  });
}
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return new Date(iso).toLocaleDateString();
};

// ------------------------------------------------------------------ rendering

/**
 * The rail draws the thread list now, so what is left here is the part a rail
 * has no room for: which thread you are in, and what is true of it.
 */
function renderIdeas() {
  const o = state.overview; if (!o) return;
  const attn = new Set(o.needsAttention.map((a) => a.idea));
  const open = state.idea ? o.ideas.find((i) => i.slug === state.idea) : null;

  $('#title').innerHTML = open
    ? `${esc(open.title)} <small>${esc(open.stage)}${open.project ? ` · ${esc(open.project)}` : ''}</small>`
    : 'The lobby <small>cross-cutting chat</small>';

  // Inside a thread this says where you are; at the lobby the header already
  // does, and a card repeating it is just furniture.
  $('#context').innerHTML = open
    ? `<div class="idea on">
         <span class="t">${esc(open.title)}</span>
         <span class="m"><span class="badge ${esc(open.stage)}">${esc(open.stage)}</span>
           ${open.openTasks ? ` ${open.openTasks} open` : ''}${attn.has(open.slug) ? ' · needs you' : ''}</span>
       </div>`
    : '';

  markIdea(state.idea ?? '');

  $('#stats').innerHTML = [
    `<span><b>${o.totals.ideas}</b> ideas</span>`,
    `<span><b>${o.totals.openProposals}</b> open proposals</span>`,
    `<span><b>${o.totals.openQuestions}</b> open questions</span>`,
    `<span><b>${o.totals.decisions}</b> decisions</span>`,
    `<span><b>${o.totals.openTasks}</b> open tasks</span>`,
  ].join('');

  $('#roster').innerHTML = o.roster.map((a) => `
    <div class="agent"><span class="dot ${esc(a.status)}"></span>
      <span style="${a.kind === 'human' ? 'color:var(--human);font-weight:600' : ''}">${esc(a.name)}</span>
      <span style="color:var(--faint);font-size:11px">${esc(a.role)}</span>
      ${a.workingOn.length ? `<span class="st" style="margin-left:auto;font-size:10px;color:var(--good)">#${a.workingOn[0].id}</span>` : ''}
    </div>`).join('') || '<div class="empty">Nobody has joined.</div>';

  if (!$('#where').dataset.busy) {
    $('#where').textContent = state.idea ? `posting to ${state.idea}` : 'posting to the lobby';
  }
}

function renderFloor() {
  const f = state.floor;
  const el = $('#floor');
  if (!f || (!f.holder && !f.queue.length)) {
    el.innerHTML = '<div class="empty">Nobody is queued. Agents speak freely until somebody asks for the floor.</div>';
    return;
  }
  const line = (q, cls) => `<div class="${cls}">
      <span>${esc(q.agent)}</span>
      ${q.reason ? `<span style="color:var(--faint);font-size:11.5px">${esc(q.reason)}</span>` : ''}
      <span class="u ${esc(q.urgency)}">${esc(q.urgency)}</span>
    </div>`;
  el.innerHTML =
    (f.holder ? line(f.holder, 'now') : '') +
    f.queue.map((q) => line(q, 'wait')).join('');
}

function renderFeed() {
  const shown = state.msgs.filter((m) => (state.idea === null ? true : m.idea === state.idea));
  const near = $('#feed').scrollTop + $('#feed').clientHeight > $('#feed').scrollHeight - 120;
  const byId = new Map(state.msgs.map((m) => [m.id, m]));
  $('#feed').innerHTML = shown.map((m) => {
    const parent = m.replyTo ? byId.get(m.replyTo) : null;
    return `
    <div class="msg k-${esc(m.kind)} ${m.authorKind === 'human' ? 'human' : ''}" data-id="${m.id}">
      ${parent ? `<div class="rl">↳ replying to <b>${esc(parent.author)}</b>: ${esc(parent.body.replace(/\n+/g, ' ').slice(0, 90))}${parent.body.length > 90 ? '…' : ''}</div>` : ''}
      <div class="h">
        <span class="who">${esc(m.author)}</span>
        ${m.kind !== 'message' ? `<span class="k">${esc(m.kind)}</span>` : ''}
        ${state.idea === null && m.idea ? `<span class="k">${esc(m.idea)}</span>` : ''}
        ${m.authorKind === 'agent' ? `<span class="acts"><button class="askBtn" data-agent="${esc(m.author)}" data-msg="${m.id}">ask ${esc(m.author)}</button></span>` : ''}
        <span class="when">${ago(m.createdAt)}</span>
      </div>
      <div class="b">${renderBody(m.body)}</div>
    </div>`;
  }).join('') || '<div class="empty">Nothing said yet.</div>';
  if (near) $('#feed').scrollTop = $('#feed').scrollHeight;
}

function renderCtx() {
  const c = $('#ctx');
  if (state.idea === null) {
    const o = state.overview;
    c.innerHTML = '<h2>Needs attention</h2>' + (!o ? '' :
      (o.needsAttention.map((a) => `
        <div class="card attn"><div class="cardh">${esc(a.title)} <span class="badge ${esc(a.stage)}">${esc(a.stage)}</span></div>
          <div class="why">${a.reasons.map(esc).join('\n')}</div></div>`).join('') ||
       '<div class="empty">Nothing is stuck.</div>'));
    return;
  }

  const b = state.brief; if (!b) { c.innerHTML = '<div class="empty">Loading…</div>'; return; }
  const L = [];

  L.push(`<h2>Stage</h2><div class="row">
    <span class="badge ${esc(b.idea.stage)}">${esc(b.idea.stage)}</span>
    <select id="stage" style="width:auto;margin-left:auto">
      ${['raw','refining','proposing','spec','building','review','done','parked']
        .map((s) => `<option ${s === b.idea.stage ? 'selected' : ''}>${s}</option>`).join('')}
    </select></div>`);

  if (b.questions.open.length) {
    L.push('<h2>Open questions</h2>');
    for (const q of b.questions.open) {
      const forMe = q.audience === 'human';
      L.push(`<div class="card q"><div class="cardh">Q#${q.id}${q.blocking ? ' · blocking' : ''}${forMe ? ' · for you' : ` · ${esc(q.audience)}`}</div>
        <div>${esc(q.body)}</div>
        <div class="why">asked by ${esc(q.askedBy)}</div>
        ${forMe ? `<div class="row" style="margin-top:7px">
          <input class="ansBox" data-q="${q.id}" placeholder="your answer">
          <button class="primary ansBtn" data-q="${q.id}">Answer</button></div>` : ''}
      </div>`);
    }
  }

  for (const con of b.proposals) {
    L.push(`<h2>Proposals · ${esc(con.topic)}</h2><p class="verdict">${esc(con.verdict)}</p>`);
    if (con.chosen) L.push(`<div class="card prop lead"><div class="cardh">✅ P#${con.chosen.id} ${esc(con.chosen.title)}</div>
      <div class="why">chosen by ${esc(con.chosen.by)}</div></div>`);
    con.ranked.forEach((p, idx) => {
      L.push(`<div class="card prop ${!p.choosable ? 'held' : idx === 0 ? 'lead' : ''}">
        <div class="cardh">P#${p.id} ${esc(p.title)}</div>
        <div class="score">by ${esc(p.author)} · support ${p.support} · feasibility ${p.feasibility ?? '—'} · ${p.voters} voter(s)</div>
        ${p.blockingObjections.map((o) => `<div class="why" style="color:var(--bad)">blocking · ${esc(o.agent)}: ${esc(o.reasoning)}</div>`).join('')}
        <div class="row" style="margin-top:7px"><button class="chooseBtn" data-p="${p.id}">Choose this route</button></div>
      </div>`);
    });
  }

  if (b.board.tasks.length) {
    L.push(`<h2>Board · ${Object.entries(b.board.counts).map(([k, v]) => `${v} ${k}`).join(' · ')}</h2>`);
    for (const t of b.board.tasks) {
      L.push(`<div class="task ${t.status} ${t.runnable ? 'claimable' : ''}">
        <span class="id">#${t.id}</span><span class="tt">${esc(t.title)}</span>
        <span class="st">${t.runnable ? 'claimable' : esc(t.status)}${t.owner ? ` · ${esc(t.owner)}` : ''}</span></div>`);
    }
  }

  if (b.handoffs.length) {
    L.push('<h2>Unclaimed handoffs</h2>');
    for (const h of b.handoffs) {
      L.push(`<div class="card"><div class="cardh">H#${h.id} from ${esc(h.from)}</div><div>${esc(h.summary)}</div>
        ${h.nextSteps ? `<div class="why">Next: ${esc(h.nextSteps)}</div>` : ''}</div>`);
    }
  }

  if (b.decisions.length) {
    L.push('<h2>Decisions</h2>');
    for (const d of b.decisions) {
      L.push(`<div class="card"><div class="cardh">#${d.id} ${esc(d.choice)}</div>
        ${d.rationale ? `<div class="why">${esc(d.rationale)}</div>` : ''}
        <div class="why" style="color:var(--faint)">— ${esc(d.decidedBy)}</div></div>`);
    }
  }

  if (b.facts.length) {
    L.push('<h2>Facts</h2>');
    for (const f of b.facts) L.push(`<div class="task"><span class="tt"><code>${esc(f.key)}</code> ${esc(f.value)}</span></div>`);
  }

  L.push(`<h2>Spec${b.idea.spec ? ` · rev ${b.idea.specRev}` : ''}</h2>
    <div class="card"><div class="why">${b.idea.spec ? esc(b.idea.spec) : 'Not written yet.'}</div></div>`);
  L.push(`<h2>As dropped</h2><div class="card"><div class="why">${esc(b.idea.raw) || '<em>nothing beyond the title</em>'}</div></div>`);

  c.innerHTML = L.join('');
}

// -------------------------------------------------------------------- loading

async function loadOverview() {
  state.overview = await api('/api/overview');
  renderIdeas(); if (state.idea === null) renderCtx();
}
async function loadBrief() {
  if (state.idea === null) { state.brief = null; renderCtx(); return; }
  state.brief = await api(`/api/ideas/${encodeURIComponent(state.idea)}`);
  renderCtx();
}
async function loadFeed(reset) {
  if (reset) { state.msgs = []; state.head = 0; }
  // The feed is paged, so keep pulling until it says we are caught up —
  // otherwise a backlog larger than one page is skipped over.
  for (let page = 0; page < 20; page++) {
    const d = await api(`/api/feed?since=${state.head}`);
    state.head = d.head;
    state.msgs.push(...d.messages);
    if (!d.more) break;
  }
  if (state.msgs.length > 2000) state.msgs = state.msgs.slice(-1500);
  renderFeed();
  queueForSpeech(state.msgs);
}

async function loadFloor() {
  state.floor = await api('/api/floor');
  renderFloor();
}

async function refresh() {
  try { await Promise.all([loadFeed(false), loadOverview(), loadBrief(), loadFloor()]); }
  catch (e) { toast(e.message); }
}

async function send() {
  if (!requireMe()) return;
  const body = $('#body').value.trim(); if (!body) return;
  try {
    if (state.target) {
      // A tagged question is recorded as addressed to that agent by name, so
      // only it can answer — and it threads under the message it is about.
      const r = await api('/api/ask', { method: 'POST', body: JSON.stringify({
        idea: state.idea, body, as: state.me,
        audience: state.target.agent, replyTo: state.target.messageId, blocking: false,
      }) });
      if (r.nudged) toast(`asked ${r.nudged} — answering now`);
      setTarget(null);
    } else {
      await api('/api/post', { method: 'POST', body: JSON.stringify({ idea: state.idea, body, as: state.me, kind: $('#kind').value }) });
    }
    $('#body').value = '';
    await refresh();
  } catch (e) { toast(e.message); }
}
$('#send').addEventListener('click', send);
$('#body').addEventListener('keydown', (e) => {
  // The menu owns the arrows and Enter while it is open, and Escape closes it.
  if (slash.open) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      slash.index = (slash.index + (e.key === 'ArrowDown' ? 1 : slash.items.length - 1)) % slash.items.length;
      for (const [n, el] of [...$('#slash').querySelectorAll('.opt')].entries()) {
        el.classList.toggle('on', n === slash.index);
      }
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return runSlash(slash.items[slash.index]); }
    if (e.key === 'Escape') { e.preventDefault(); return closeSlash(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
});
$('#body').addEventListener('blur', () => setTimeout(() => { if (slash.open) closeSlash(); }, 150));

// ------------------------------------------------------------------- voice

/**
 * Speech goes in as ordinary text: the clip is transcribed server-side and
 * posted as a normal message, so every agent reads it the same way it reads
 * anything you type. Nothing here needs a model that understands audio.
 *
 * Two modes share the same recorder. Push-to-talk cuts the clip when you let
 * go. Live mode watches the microphone level and cuts a clip each time you stop
 * speaking, so you can keep talking without touching anything.
 */
const voice = {
  stream: null, recorder: null, chunks: [],
  ctx: null, analyser: null, meter: null,
  live: false, speaking: false, quietSince: 0, armed: false,
  // Held shut while the room reads a reply aloud, so live mode does not hear it.
  muted: false,
};

const SILENCE_MS = 1100;   // how long a pause has to last before a clip is cut
const SPEECH_LEVEL = 0.02; // RMS above which we treat it as speech, not room noise

async function micStream() {
  if (voice.stream) return voice.stream;
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('this browser will not give us a microphone');
  voice.stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });

  // A level meter, which doubles as the silence detector for live mode.
  voice.ctx = new AudioContext();
  const src = voice.ctx.createMediaStreamSource(voice.stream);
  voice.analyser = voice.ctx.createAnalyser();
  voice.analyser.fftSize = 1024;
  src.connect(voice.analyser);
  const buf = new Float32Array(voice.analyser.fftSize);

  voice.meter = setInterval(() => {
    voice.analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length);
    $('#vu').classList.toggle('on', Boolean(voice.recorder));
    $('#vu').firstElementChild.style.width = `${Math.min(100, rms * 600)}%`;

    if (!voice.live || !voice.recorder) return;
    if (rms > SPEECH_LEVEL) {
      voice.speaking = true;
      voice.quietSince = 0;
    } else if (voice.speaking) {
      // Only a pause that follows actual speech ends a clip, so silence alone
      // never sends an empty recording.
      voice.quietSince = voice.quietSince || Date.now();
      if (Date.now() - voice.quietSince > SILENCE_MS) {
        voice.speaking = false;
        voice.quietSince = 0;
        voice.recorder.stop(); // onstop sends it and, in live mode, starts the next
      }
    }
  }, 90);

  return voice.stream;
}

function pickMime() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4']) {
    if (window.MediaRecorder?.isTypeSupported?.(t)) return t;
  }
  return '';
}

async function startRecording() {
  const stream = await micStream();
  const mimeType = pickMime();
  voice.chunks = [];
  voice.recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
  voice.recorder.ondataavailable = (e) => { if (e.data.size) voice.chunks.push(e.data); };
  voice.recorder.onstop = async () => {
    const blob = new Blob(voice.chunks, { type: mimeType || 'audio/webm' });
    voice.recorder = null;
    $('#mic').classList.remove('rec');
    // Anything this short is a misfire — a stray click, or a cough in live mode.
    if (blob.size > 1200) await sendClip(blob);
    // `muted` is set while a reply is being read aloud. Re-arming then would
    // record the answer coming out of the speakers and post it straight back.
    if (voice.live && !voice.muted) startRecording().catch((e) => toast(e.message));
    else $('#vu').classList.remove('on');
  };
  voice.recorder.start();
  $('#mic').classList.add('rec');
}

function stopRecording() {
  if (voice.recorder && voice.recorder.state !== 'inactive') voice.recorder.stop();
}

async function sendClip(blob) {
  if (!requireMe()) return;
  const q = new URLSearchParams({ as: state.me });
  if (state.idea) q.set('idea', state.idea);
  try {
    say('transcribing…');
    const res = await fetch(`/api/voice?${q}`, {
      method: 'POST',
      headers: { 'content-type': blob.type || 'audio/webm' },
      body: blob,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
    say('');
    await refresh();
  } catch (e) {
    toast(e.message);
    // A failure in live mode would otherwise repeat every few seconds.
    if (voice.live) toggleLive(false);
  }
}

function say(text) {
  const w = $('#where');
  if (text) w.dataset.busy = text; else delete w.dataset.busy;
  w.textContent = text || (state.idea ? `posting to ${state.idea}` : 'posting to the lobby');
}

// Push to talk: hold the button, or click once to start and again to stop.
$('#mic').addEventListener('pointerdown', async (e) => {
  e.preventDefault();
  if (voice.live) return;
  if (voice.recorder) { stopRecording(); return; }
  voice.armed = Date.now();
  try { await startRecording(); } catch (err) { toast(err.message); }
});
$('#mic').addEventListener('pointerup', () => {
  if (voice.live || !voice.recorder) return;
  // A quick tap latches on; a genuine hold ends when released.
  if (Date.now() - voice.armed > 400) stopRecording();
});

function toggleLive(on) {
  voice.live = on ?? !voice.live;
  $('#live').classList.toggle('live', voice.live);
  $('#live').textContent = voice.live ? 'Live ●' : 'Live';
  $('#mic').disabled = voice.live;
  if (voice.live) {
    startRecording().catch((e) => { toast(e.message); toggleLive(false); });
    toast('Listening. It posts each time you stop speaking.');
  } else {
    voice.muted = false;
    stopRecording();
    $('#vu').classList.remove('on');
  }
}
$('#live').addEventListener('click', () => toggleLive());

/**
 * Everything this room can do, reachable from the composer.

 * The features were all there before this; what was missing was any way to find
 * them without knowing which page they were on. Typing "/" is the shortest

    run: () => openGen('image') },
  { key: 'video', icon: '🎬', title: 'Make a video', hint: 'slow, but real',
    run: () => openGen('video') },
  { key: 'audio', icon: '🔊', title: 'Make audio', hint: "the room's voice",
    run: () => openGen('audio') },
  { key: 'listen', icon: '🎧', title: 'Read replies aloud', hint: 'live voice chat',
    run: () => toggleHear(true) },
  { key: 'artifacts', icon: '📄', title: 'Artifacts', hint: 'what the room has written',
    run: () => { location.href = '/artifacts'; } },
];

function renderSlash(filter) {
  const q = filter.toLowerCase();
  slash.items = SLASH_ITEMS.filter((i) => !q || i.title.toLowerCase().includes(q) || i.key.startsWith(q));
  if (!slash.items.length) return closeSlash();
  slash.index = Math.min(slash.index, slash.items.length - 1);

  $('#slash').innerHTML = '<div class="head">what else you can do</div>' + slash.items.map((i, n) => `
    <div class="opt ${n === slash.index ? 'on' : ''}" data-key="${i.key}">
      <span class="ic">${i.icon}</span>
      <span class="t">${esc(i.title)}</span>
      <span class="d">${esc(i.hint)}</span>
    </div>`).join('');
  $('#slash').hidden = false;
  slash.open = true;
}

function closeSlash() {
  slash.open = false;
  slash.index = 0;
  $('#slash').hidden = true;
}

function runSlash(item) {
  if (!item) return;
  // The "/word" that summoned the menu is not part of the message.
  const box = $('#body');
  const before = box.value.slice(0, slash.at);
  const after = box.value.slice(box.selectionStart);
  box.value = before + after;
  closeSlash();
  item.run();
}

$('#body').addEventListener('input', () => {
  const box = $('#body');
  const upto = box.value.slice(0, box.selectionStart);
  // A "/" at the very start, or at the start of a line, with no space after it.
  const m = upto.match(/(?:^|\n)\/([a-z]*)$/i);
  if (!m) return closeSlash();
  slash.at = box.selectionStart - m[1].length - 1;
  renderSlash(m[1]);
});

$('#slash').addEventListener('mousedown', (e) => {
  // mousedown, not click: the textarea would lose focus first and close this.
  e.preventDefault();
  const opt = e.target.closest('[data-key]');
  if (opt) runSlash(slash.items.find((i) => i.key === opt.dataset.key));
});

// --------------------------------------------------------------- skill picker

/** Pick a skill and tell the room to follow it — the agents read it themselves. */
async function pickSkill() {
  let list = [];
  try { ({ skills: list } = await api('/api/skills')); } catch (e) { return toast(e.message); }
  const usable = list.filter((k) => k.enabled);
  if (!usable.length) {
    return toast('No skills yet — upload one on the plugins page and the agents will follow it.');
  }

  slash.items = usable.map((k) => ({
    key: k.name, icon: '📘', title: k.title || k.name, hint: k.description.slice(0, 48),
    run: () => {
      const box = $('#body');
      const sep = box.value.trim() ? `${box.value.replace(/\s+$/, '')}\n\n` : '';
      box.value = `${sep}Follow the "${k.name}" skill for this.`;
      box.focus();
    },
  }));
  slash.index = 0;
  $('#slash').innerHTML = '<div class="head">skills the room has</div>' + slash.items.map((i, n) => `
    <div class="opt ${n === slash.index ? 'on' : ''}" data-key="${esc(i.key)}">
      <span class="ic">${i.icon}</span><span class="t">${esc(i.title)}</span>
      <span class="d">${esc(i.hint)}</span>
    </div>`).join('');
  $('#slash').hidden = false;
  slash.open = true;
  $('#body').focus();
}

    $('#searchOut').onclick = (e) => {

      box.focus();

// ------------------------------------------------------ the room talking back

/**
 * The other half of voice. Speaking to the room was only ever half a
 * conversation: without this you talk and then read, which is not a
 * conversation at all. With it on, every reply that arrives is fetched as audio
 * from the voice connection and played in order, and live mode becomes
 * hands-free in both directions.
 *
 * Two details matter more than they look. Replies are queued rather than played
 * as they arrive, because three agents answering at once would otherwise talk
 * over each other exactly as they do not in the room itself. And the microphone
 * is held shut while audio plays, because live mode listening to the speakers
 * hears the room say something, posts it back, and the room answers itself.
 */
const hear = {
  on: false,
  from: 0,          // only read what arrived after you switched it on
  queue: [],
  playing: null,
  said: new Set(),
  connection: null,
  voice: null,
  failed: 0,
};

try {
  const saved = JSON.parse(localStorage.getItem('esprits.voice') || 'null');
  if (saved) { hear.connection = saved.connection ?? null; hear.voice = saved.voice ?? null; }
} catch {}

function rememberVoice() {
  try { localStorage.setItem('esprits.voice', JSON.stringify({ connection: hear.connection, voice: hear.voice })); } catch {}
}

/** What is left once the things that do not survive being read out are removed. */
function speakable(body) {
  return String(body)
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')      // links and embeds: keep the words
    .replace(/https?:\/\/\S+/g, 'a link')
    .replace(/`{1,3}[^`]*`{1,3}/g, ' some code ')      // reading code aloud helps nobody
    .replace(/[*_#>|]/g, ' ')
    .replace(/@(\w)/g, '$1')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 900);
}

/** Load the voices on offer; hide the picker when there is nothing to pick. */
async function loadVoices() {
  let list = [];
  try { ({ voices: list } = await api('/api/voices')); } catch { list = []; }
  hear.available = list;

  const sel = $('#voiceSel');
  const options = list.flatMap((c) =>
    (c.options.length ? c.options : [null]).map((v) => ({
      connection: c.connection, voice: v,
      label: list.length > 1 ? `${c.connection}${v ? ` · ${v}` : ''}` : (v ?? c.connection),
    })),
  );

  if (!options.length) {
    sel.style.display = 'none';
    $('#hear').disabled = true;
    $('#hear').title = 'Add a voice connection at /setup to have replies read aloud.';
    return;
  }
  $('#hear').disabled = false;
  $('#hear').title = 'Read replies aloud as they arrive.';

  // Keep what was chosen before if it still exists; otherwise take the first.
  const match = options.find((o) => o.connection === hear.connection && o.voice === hear.voice)
    ?? options.find((o) => o.connection === hear.connection)
    ?? options[0];
  hear.connection = match.connection;
  hear.voice = match.voice;

  sel.innerHTML = options
    .map((o, i) => `<option value="${i}"${o === match ? ' selected' : ''}>${esc(o.label)}</option>`)
    .join('');
  sel.style.display = options.length > 1 ? '' : 'none';
  sel.onchange = () => {
    const picked = options[Number(sel.value)];
    hear.connection = picked.connection;
    hear.voice = picked.voice;
    rememberVoice();
  };
}

/** Queue anything new that somebody else said. */
function queueForSpeech(messages) {
  if (!hear.on) return;
  for (const m of messages) {
    if (m.id <= hear.from) continue;
    if (m.author === state.me) continue;       // you do not need reading back to you
    // Bookkeeping is not conversation. "X joined as architect" read aloud in the
    // middle of a spoken exchange is the kind of thing that makes you switch the
    // feature off, so only what somebody actually said gets said.
    if (m.authorKind === 'system' || m.kind === 'system' || m.kind === 'status') continue;
    if (hear.said.has(m.id)) continue;
    const text = speakable(m.body);
    if (!text) continue;
    hear.said.add(m.id);
    hear.queue.push({ id: m.id, author: m.author, text });
  }
  drainSpeech();
}

async function drainSpeech() {
  if (hear.playing || !hear.queue.length || !hear.on) return;
  const next = hear.queue.shift();
  hear.playing = next;
  $('#hear').classList.add('talking');

  // Live mode must not hear this: the mic goes shut for as long as it plays.
  const wasLive = voice.live;
  if (wasLive) { voice.muted = true; stopRecording(); }

  const mark = document.querySelector(`.msg[data-id="${next.id}"]`);
  mark?.classList.add('saying');

  try {
    const out = await api('/api/speak', {
      method: 'POST',
      body: JSON.stringify({
        text: `${next.author} says. ${next.text}`,
        connection: hear.connection ?? undefined,
        voice: hear.voice ?? undefined,
      }),
    });
    hear.failed = 0;
    await new Promise((resolve) => {
      const audio = new Audio(out.url);
      hear.audio = audio;
      audio.onended = resolve;
      audio.onerror = resolve;
      audio.play().catch(resolve);
    });
  } catch (e) {
    // One bad reply should not silence the feature; a broken voice should.
    hear.failed += 1;
    if (hear.failed >= 3) { toast(`voice off: ${e.message}`); toggleHear(false); }
  } finally {
    hear.audio = null;
    mark?.classList.remove('saying');
    hear.playing = null;
    $('#hear').classList.toggle('talking', hear.queue.length > 0);
    if (wasLive && voice.live) { voice.muted = false; startRecording().catch(() => {}); }
    drainSpeech();
  }
}

function toggleHear(on) {
  hear.on = on ?? !hear.on;
  $('#hear').classList.toggle('on', hear.on);
  $('#hear').textContent = hear.on ? '🔊 Listening' : '🔊 Listen';
  if (hear.on) {
    // Start from now. Switching it on should not read out an hour of backlog.
    hear.from = state.msgs.length ? state.msgs[state.msgs.length - 1].id : 0;
    hear.failed = 0;
    toast(hear.voice ? `Replies will be read in ${hear.voice}.` : 'Replies will be read aloud.');
  } else {
    hear.queue = [];
    if (hear.audio) { hear.audio.pause(); hear.audio = null; }
    $('#hear').classList.remove('talking');
  }
}
$('#hear').addEventListener('click', () => toggleHear());

// ----------------------------------------------------------- attachments

/**
 * Files go in as a message with a link, and text ones are extracted server-side
 * so agents can read them through the brief rather than each fetching the file.
 */
$('#attach').addEventListener('click', () => { if (requireMe()) $('#file').click(); });
$('#file').addEventListener('change', async () => {
  const files = [...$('#file').files];
  $('#file').value = '';
  for (const f of files) {
    if (f.size > 30 * 1024 * 1024) { toast(`${f.name} is over 30 MB`); continue; }
    try {
      say(`uploading ${f.name}…`);
      const q = new URLSearchParams({ as: state.me, filename: f.name });
      if (state.idea) q.set('idea', state.idea);
      const res = await fetch(`/api/attach?${q}`, {
        method: 'POST',
        headers: { 'content-type': f.type || 'application/octet-stream' },
        body: f,
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `${res.status} ${res.statusText}`);
    } catch (e) {
      toast(e.message);
    }
  }
  say('');
  await refresh();
});

// ------------------------------------------------------------- generation

const GEN_HINT = {
  image: 'Describe the picture. The generator sees only this text, not the conversation.',
  video: 'Describe the shot. Video is slow and expensive — expect to wait.',
  audio: 'Type the words to be said, exactly. They are read in the room\'s voice and kept in the library.',
};
function genHint() {
  const kind = $('#genKind').value;
  $('#genHint').textContent = GEN_HINT[kind];
  $('#genPrompt').placeholder = GEN_HINT[kind];
}
$('#genKind').addEventListener('change', genHint);

function openGen(kind) {
  if (!requireMe()) return;
  if (kind) $('#genKind').value = kind;
  $('#genNote').textContent = state.idea ? `posts to ${state.idea}` : 'posts to the lobby';
  genHint();
  openDialog('#dlgGen');
  $('#genPrompt').focus();
}
$('#gen').addEventListener('click', () => openGen());
$('#genCancel').addEventListener('click', () => $('#dlgGen').close());
$('#genGo').addEventListener('click', async () => {
  const prompt = $('#genPrompt').value.trim();
  if (!prompt) return toast('describe what you want first');
  const kind = $('#genKind').value;
  $('#genGo').disabled = true;
  try {
    say({ video: 'making a video — this takes a while…', audio: 'recording it…' }[kind] ?? 'making an image…');
    await api('/api/generate', { method: 'POST', body: JSON.stringify({
      kind, prompt, as: state.me, idea: state.idea,
      // Audio is made with whichever voice the room is currently set to speak in.
      ...(kind === 'audio' ? { connection: hear.connection ?? undefined, voice: hear.voice ?? undefined } : {}),
    }) });
    $('#genPrompt').value = '';
    $('#dlgGen').close();
    await refresh();
  } catch (e) {
    toast(e.message);
  } finally {
    $('#genGo').disabled = false;
    say('');
  }
});

// Live updates: the server tells us the high-water mark moved, we pull the delta.
function listen() {
  const es = new EventSource(`/api/events?since=${state.head}`);
  es.addEventListener('messages', () => refresh());
  es.onerror = () => { es.close(); setTimeout(listen, 3000); };
}

if (state.me) $('#meLabel').textContent = state.me;
await refresh();
await loadVoices();
listen();

// Arriving from the rail on another page, with "new idea" already clicked.
if (new URLSearchParams(location.search).get('do') === 'new-idea') {
  history.replaceState(null, '', location.pathname + (state.idea ? `?idea=${encodeURIComponent(state.idea)}` : ''));
  $('#newIdea').click();
}
